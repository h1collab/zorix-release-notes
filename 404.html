<title>404 · Page not found | Zorix</title>
<style>
:root{--bg:#fff;--ink:#111;--muted:#6f6f6b;--line:#e5e5e1;--max:1180px}
*{box-sizing:border-box}html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"OpenAI Sans","Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}.shell{width:min(var(--max),100%);margin:auto;padding:0 28px}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:650;letter-spacing:-.045em}.nav-meta{color:var(--muted);font-size:11px}main{min-height:calc(100vh - 68px);display:grid;grid-template-rows:1fr auto}.hero{display:grid;align-content:center;padding:76px 0 72px}.status{margin:0;font-size:clamp(96px,18vw,224px);line-height:.76;font-weight:500;letter-spacing:-.09em}.headline{max-width:760px;margin:42px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,3.6vw,44px);line-height:1.16;font-weight:400;letter-spacing:-.035em}.dek{max-width:650px;margin:18px 0 0;color:#4d4d49;font-size:14px;line-height:1.65}.poem-wrap{max-width:720px;margin-top:52px;padding-top:24px;border-top:1px solid var(--line)}.poem-label{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.poem{margin-top:17px;white-space:pre-line;font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.62}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:36px}.button{min-height:42px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:9px;font-size:11px}.button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.path{margin-top:28px;color:var(--muted);font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}.footer{padding:24px 0 34px;display:flex;justify-content:space-between;gap:24px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.5}.credit strong{color:var(--ink);font-weight:600}@media(max-width:700px){.shell{padding:0 18px}.hero{padding:56px 0 54px}.footer{flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
  <div class="nav"><a class="brand" href="/">Zorix</a><div class="nav-meta">Updates</div></div>
  <main>
    <section class="hero">
      <h1 class="status">404</h1>
      <div class="headline">Page not found.</div>
      <p class="dek">This page is not here. It may have moved, changed names, or never existed.</p>
      <div class="poem-wrap"><div class="poem-label">A small poem for this missing page</div><div class="poem" id="poem"></div></div>
      <div class="actions"><a class="button primary" href="/">Return home</a><a class="button" href="/number-of-calls/models/">Models</a><a class="button" href="/number-of-calls/">Zorix Metron</a></div>
      <div class="path" id="path"></div>
    </section>
    <footer class="footer"><div>404 · The requested resource could not be found.</div><div class="credit">Generated by <strong>Nex Coder 3.8 Neptune</strong></div></footer>
  </main>
</div>
<script>
(()=>{const poems=[
["A route once drawn in quiet light,","now ends before the page begins.","The browser keeps the empty address,","while the answer lives elsewhere."],
["No document waits behind this path.","Only a clean white margin,","a name the server cannot remember,","and somewhere, another door."],
["The link arrived before the page,","or after it had gone.","Between those two small moments,","404 keeps the room."],
["A missing page leaves little noise:","one address, one unanswered knock.","Return to where the map is whole,","and choose another line."],
["Nothing broke the horizon.","The path simply stopped.","Beyond it, the site continues","under a different name."],
["This coordinate has no page today.","The request reached the edge,","found only whitespace,","and came back carrying 404."],
["The address kept walking,","but the page took another road.","A blank margin answers softly:","there is nothing here to open."],
["One path vanished from the map.","The request still arrived on time.","It found a quiet border","where the page should have been."]];const i=Math.floor(Math.random()*poems.length);document.getElementById("poem").textContent=poems[i].join("\n");document.getElementById("path").textContent=location.pathname})();
</script>
</body>
</html>
