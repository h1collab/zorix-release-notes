<!doctype html>
<html lang="en">

<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="zorix-build" content="1788171825">


<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="robots"
  content="noindex"
>

<title>
Page not found | Zorix
</title>

<style>

:root{
  --text:#111;
  --muted:#70706a;
  --line:#e3e3de;
  --soft:#f7f7f4;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  min-height:100vh;

  display:grid;
  place-items:center;

  background:#fff;
  color:var(--text);

  font-family:
    "OpenAI Sans",
    "Inter",
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:
    antialiased;
}

main{
  width:min(
    620px,
    calc(100% - 34px)
  );

  padding:
    55px
    0;
}

.code{
  color:var(--muted);

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:.08em;
}

h1{
  margin:
    16px
    0
    0;

  font-size:
    clamp(
      48px,
      10vw,
      86px
    );

  line-height:.91;

  font-weight:500;

  letter-spacing:-.065em;
}

p{
  max-width:500px;

  margin-top:22px;

  color:var(--muted);

  font-size:14px;

  line-height:1.55;
}

.actions{
  display:flex;
  flex-wrap:wrap;

  gap:8px;

  margin-top:28px;
}

a{
  min-height:39px;

  display:inline-flex;

  align-items:center;

  padding:
    0
    13px;

  border:
    1px solid var(--line);

  border-radius:9px;

  color:var(--text);

  text-decoration:none;

  font-size:11px;
}

a.primary{
  background:#111;
  color:#fff;

  border-color:#111;
}

a:hover{
  background:var(--soft);
}

a.primary:hover{
  background:#262626;
}

.path{
  margin-top:34px;

  padding:
    13px;

  overflow-wrap:anywhere;

  border:
    1px solid var(--line);

  border-radius:9px;

  color:var(--muted);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;

  font-size:10px;
}

</style>

</head>


<body>

<main>

  <div class="code">
    Error 404
  </div>

  <h1>
    Page not found
  </h1>

  <p id="message">
    The page you requested does not exist or may have moved.
  </p>


  <div class="actions">

    <a
      class="primary"
      href="/"
    >
      Zorix Updates
    </a>

    <a href="/number-of-calls/">
      Metron
    </a>

    <a href="/number-of-calls/models/">
      Models
    </a>

  </div>


  <div
    class="path"
    id="path"
  ></div>

</main>


<script>

(function(){

  "use strict";


  const pathname =
    decodeURIComponent(
      location.pathname
    );


  document
    .getElementById(
      "path"
    )
    .textContent=
      location.pathname;


  /*
   * Previous broken builds created URLs such as:
   *
   * /models/${ encodeURIComponent(model.id) }/
   *
   * There is no model ID inside that URL anymore,
   * so the safest recovery destination is the catalog.
   */
  if(
    pathname.includes(
      "${"
    )
    ||
    location.pathname
      .toLowerCase()
      .includes(
        "%24%7b"
      )
  ){

    document
      .getElementById(
        "message"
      )
      .textContent=
        "This link came from an older malformed model route. Redirecting to the model catalog…";


    setTimeout(
      function(){

        location.replace(
          "/number-of-calls/models/"
        );

      },
      650
    );


    return;

  }


  /*
   * Unknown path under the model directory.
   * Avoid leaving users on a generic dead end.
   */
  if(
    pathname.startsWith(
      "/number-of-calls/models/"
    )
  ){

    document
      .getElementById(
        "message"
      )
      .textContent=
        "That model route is not available. Redirecting to the current model catalog…";


    setTimeout(
      function(){

        location.replace(
          "/number-of-calls/models/"
        );

      },
      900
    );

  }

})();

</script>

</body>
</html>
