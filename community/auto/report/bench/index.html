<body>

<header>

  <div class="nav">

    <div class="brand">
      Zorix Community
    </div>

    <a
      href="/number-of-calls/share/"
    >
      Share charts
    </a>

  </div>

</header>

<main>

  <div class="eyebrow">
    Auto reports
  </div>

  <h1>
    Benchmark<br>
    reports
  </h1>

  <div class="copy">
    Automatically generated reports based on
    published Zorix Metron benchmark or ranking data.
  </div>

  <div
    class="reports"
    id="reports"
  ></div>

</main>

<script src="./reports.js?v=1788181089"></script>

<script>

const DATA =
  window.ZORIX_AUTO_BENCH_REPORTS || {
    reports:[]
  };


function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}


const reports =
  DATA.reports || [];


/*
 * Provider profile routes.
 * Only use routes that exist in the Zorix site structure.
 */
function providerRoute(provider){

  const normalized =
    String(
      provider || ""
    )
    .trim()
    .toLowerCase();


  const routes={

    "zorix":
      "/zorix/",

    "anthropic":
      "/anthropic/",

    "openai":
      "/openai/",

    "google":
      "/google/",

    "deepseek":
      "/deepseek/",

    "tencent":
      "/tencent/",

    "tencent hunyuan":
      "/tencent/",

    "z.ai":
      "/zai/",

    "zai":
      "/zai/",

    "xiaomi":
      "/xiaomi/"
  };


  return (
    routes[normalized] ||
    null
  );

}


function providerHandle(provider){

  return (
    String(
      provider || ""
    )
    .replace(
      /\s+/g,
      ""
    )
  );

}


function providerLink(provider){

  const route =
    providerRoute(
      provider
    );


  const handle =
    "@"+
    providerHandle(
      provider
    );


  if(!route){

    return esc(
      handle
    );

  }


  return `
    <a
      class="provider-link"
      href="${route}"
      title="View ${esc(provider)} details"
    >
      ${esc(handle)}
    </a>
  `;

}


/*
 * Converts known @provider mentions inside announcement
 * text into provider profile links.
 */
function linkAnnouncementProviders(text){

  let html =
    esc(
      text || ""
    );


  const providers=[
    "TencentHunyuan",
    "Anthropic",
    "DeepSeek",
    "OpenAI",
    "Google",
    "Xiaomi",
    "Zorix",
    "Z.ai"
  ];


  const routeByHandle={

    "TencentHunyuan":
      "/tencent/",

    "Anthropic":
      "/anthropic/",

    "DeepSeek":
      "/deepseek/",

    "OpenAI":
      "/openai/",

    "Google":
      "/google/",

    "Xiaomi":
      "/xiaomi/",

    "Zorix":
      "/zorix/",

    "Z.ai":
      "/zai/"
  };


  providers.forEach(
    handle=>{

      const escaped =
        handle.replace(
          /[.*+?^${}()|[\]\\]/g,
          "\\$&"
        );


      const pattern =
        new RegExp(
          "@"+escaped,
          "g"
        );


      html =
        html.replace(
          pattern,
          `<a
             class="provider-link"
             href="${routeByHandle[handle]}"
           >@${handle}</a>`
        );

    }
  );


  return html;

}


function renderAnnouncement(report){

  const text =
    String(
      report.announcement || ""
    );


  const paragraphs =
    text
    .split(
      /\n\s*\n/
    )
    .map(
      paragraph=>
        paragraph.trim()
    )
    .filter(Boolean);


  return paragraphs
    .map(
      paragraph=>`
        <p>
          ${
            linkAnnouncementProviders(
              paragraph
            )
          }
        </p>
      `
    )
    .join("");

}


function renderRanking(report){

  const ranking =
    Array.isArray(
      report.ranking
    )
      ? report.ranking
      : [];


  if(!ranking.length){
    return "";
  }


  return `
    <div class="ranking">

      <div class="ranking-head">
        <span>Rank</span>
        <span>Model</span>
        <span>Score</span>
      </div>

      ${
        ranking
        .map(
          row=>{

            const route =
              providerRoute(
                row.provider
              );


            return `
              <div class="ranking-row">

                <div class="ranking-rank">
                  #${esc(row.rank)}
                </div>

                <div class="ranking-model">

                  <div class="ranking-name">

                    ${
                      row.id
                        ? `
                          <a
                            href="/number-of-calls/models/${encodeURIComponent(row.id)}/"
                          >
                            ${esc(row.name)}
                          </a>
                        `
                        : esc(
                            row.name
                          )
                    }

                  </div>

                  ${
                    row.provider
                      ? route
                        ? `
                          <a
                            class="ranking-provider"
                            href="${route}"
                          >
                            ${
                              providerLink(
                                row.provider
                              )
                            }
                          </a>
                        `
                        : `
                          <span class="ranking-provider">
                            @${esc(
                              providerHandle(
                                row.provider
                              )
                            )}
                          </span>
                        `
                      : ""
                  }

                </div>

                <div class="ranking-score">
                  ${
                    Number(
                      row.score
                    ).toFixed(1)
                  }
                </div>

              </div>
            `;

          }
        )
        .join("")
      }

    </div>
  `;

}



document
  .getElementById(
    "reports"
  )
  .innerHTML=
    reports.length
      ? reports.map(
          report=>{

            const top =
              Array.isArray(
                report.ranking
              )
              &&
              report.ranking.length
                ? report.ranking[0]
                : null;


            return `

              <article class="report">

                <div class="report-kicker">
                  Metron benchmark update
                </div>


                <div class="report-title">
                  ${
                    esc(
                      report.title ||
                      report.metric ||
                      "Benchmark update"
                    )
                  }
                </div>


                <div class="report-meta">

                  <span>
                    ${
                      esc(
                        report.metric ||
                        "Benchmark"
                      )
                    }
                  </span>

                  <span>
                    ${
                      esc(
                        report.method ||
                        "Published evaluation"
                      )
                    }
                  </span>

                  <span>
                    ${
                      report.createdAt
                        ? new Date(
                            report.createdAt
                          )
                          .toLocaleString()
                        : "Published"
                    }
                  </span>

                </div>


                <div class="report-layout">

                  <div>

                    ${
                      report.pngBase64
                        ? `
                          <img
                            class="report-image"
                            src="${report.pngBase64}"
                            alt="${
                              esc(
                                report.title ||
                                report.metric ||
                                "Benchmark ranking"
                              )
                            }"
                          >
                        `
                        : ""
                    }


                    ${
                      renderRanking(
                        report
                      )
                    }

                  </div>


                  <aside class="report-side">

                    <div class="report-side-label">
                      Report
                    </div>


                    <div class="report-text">
                      ${
                        renderAnnouncement(
                          report
                        )
                      }
                    </div>


                    ${
                      top &&
                      top.provider
                        ? `
                          <div class="report-actions">

                            ${
                              providerRoute(
                                top.provider
                              )
                                ? `
                                  <a
                                    class="report-action"
                                    href="${
                                      providerRoute(
                                        top.provider
                                      )
                                    }"
                                  >
                                    View ${
                                      esc(
                                        top.provider
                                      )
                                    }
                                  </a>
                                `
                                : ""
                            }

                            <a
                              class="report-action"
                              href="/number-of-calls/share/"
                            >
                              Open Share
                            </a>

                          </div>
                        `
                        : ""
                    }

                  </aside>

                </div>

              </article>

            `;

          }
        )
        .join("")
      : `
          <div class="empty">
            No benchmark reports have been published yet.
          </div>
        `;

</script>
