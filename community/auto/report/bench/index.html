<!doctype html>
<html lang="en">

<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="zorix-build" content="1788160329">




<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Auto Benchmark Reports | Zorix
</title>

<style>

:root{
  --text:#111;
  --muted:#6f6f69;
  --line:#dfdfda;
  --soft:#f7f7f4;
  --max:1100px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  color:var(--text);

  font-family:
    "OpenAI Sans",
    "Inter",
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

a{
  color:inherit;
}

header{
  border-bottom:
    1px solid var(--line);
}

.nav{
  max-width:var(--max);

  height:68px;

  margin:auto;

  padding:
    0 22px;

  display:flex;

  align-items:center;
  justify-content:space-between;
}

.brand{
  font-weight:600;

  letter-spacing:-.035em;
}

main{
  max-width:var(--max);

  margin:auto;

  padding:
    60px
    22px
    110px;
}

.eyebrow{
  color:var(--muted);

  font-size:12px;

  margin-bottom:13px;
}

h1{
  margin:0;

  font-size:
    clamp(
      48px,
      8vw,
      82px
    );

  font-weight:500;

  line-height:.94;

  letter-spacing:-.06em;
}

.copy{
  max-width:700px;

  margin-top:20px;

  color:var(--muted);

  line-height:1.55;

  font-size:14px;
}

.reports{
  margin-top:46px;
}

.report{
  padding:
    27px
    0;

  border-top:
    1px solid var(--line);
}

.report-title{
  font-size:24px;

  letter-spacing:-.035em;
}

.report-meta{
  display:flex;

  flex-wrap:wrap;

  gap:12px;

  margin-top:10px;

  color:var(--muted);

  font-size:10px;
}

.report-text{
  margin-top:16px;

  max-width:760px;

  white-space:pre-wrap;

  font-size:13px;

  line-height:1.6;
}

.report-image{
  margin-top:20px;

  width:min(
    100%,
    800px
  );

  border:
    1px solid var(--line);

  border-radius:12px;
}

.empty{
  margin-top:50px;

  padding:40px;

  border:
    1px solid var(--line);

  border-radius:13px;

  text-align:center;

  color:var(--muted);
}

</style>

</head>

<body>

<header>

  <div class="nav">

    <div class="brand">
      Zorix Community
    </div>

    <a
      href="/number-of-calls/share/"
    >
      Share charts
    </a>

  </div>

</header>

<main>

  <div class="eyebrow">
    Auto reports
  </div>

  <h1>
    Benchmark<br>
    reports
  </h1>

  <div class="copy">
    Automatically generated reports based on
    published Zorix Metron benchmark or ranking data.
  </div>

  <div
    class="reports"
    id="reports"
  ></div>

</main>

<script src="./reports.js?v=1788160329"></script>

<script>

const DATA =
  window.ZORIX_AUTO_BENCH_REPORTS || {
    reports:[]
  };


function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}


const reports =
  DATA.reports || [];


document
  .getElementById(
    "reports"
  )
  .innerHTML=
    reports.length
      ? reports.map(
          report=>`

            <article class="report">

              <div class="report-title">
                ${
                  esc(
                    report.title
                  )
                }
              </div>

              <div class="report-meta">

                <span>
                  ${
                    esc(
                      report.createdAt
                    )
                  }
                </span>

                <span>
                  ${
                    esc(
                      report.metric
                    )
                  }
                </span>

                <span>
                  ${
                    esc(
                      report.method ||
                      "Published evaluation"
                    )
                  }
                </span>

              </div>

              ${
                report.pngBase64
                  ? `
                    <img
                      class="report-image"
                      src="${
                        report.pngBase64
                      }"
                      alt=""
                    >
                  `
                  : ""
              }

              <div class="report-text">
                ${
                  esc(
                    report.announcement
                  )
                }
              </div>

            </article>

          `
        ).join("")
      : `
          <div class="empty">
            No benchmark reports have been published yet.
          </div>
        `;

</script>

</body>
</html>
