<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- 外層狼眼眶 (銳利三角) -->
  <path d="M200,60 L280,320 L200,260 L120,320 Z" fill="none" stroke="#7a8a9a" stroke-width="2" opacity="0.6"/>
  <!-- 內層瞳孔 -->
  <circle cx="200" cy="200" r="45" fill="none" stroke="#c0c0d0" stroke-width="2.5"/>
  <!-- Theta 橫槓 -->
  <line x1="175" y1="200" x2="225" y2="200" stroke="#ffdd44" stroke-width="3" opacity="0.9"/>
  <!-- 眼角高光 -->
  <circle cx="180" cy="180" r="4" fill="#ffdd44" opacity="0.4"/>
</svg>
