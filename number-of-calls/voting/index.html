<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Community voting | Zorix Code</title>

<style>

:root{
  --bg:#fff;
  --text:#111;
  --muted:#696966;
  --line:#deded9;
  --soft:#f7f7f4;
  --max:1080px;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body{
  margin:0;

  background:var(--bg);
  color:var(--text);

  font-family:
    "OpenAI Sans",
    "Inter",
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

  letter-spacing:-.012em;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
  color:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:30;

  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);

  border-bottom:1px solid var(--line);
}

.nav{
  max-width:var(--max);
  height:66px;

  margin:auto;
  padding:0 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:20px;
  font-weight:600;
  letter-spacing:-.045em;
}

.nav-right{
  display:flex;
  gap:23px;

  align-items:center;

  font-size:13px;
}

main{
  max-width:var(--max);

  margin:auto;

  padding:
    58px
    24px
    120px;
}


/* ---------------------------------------------------------
   hero
   --------------------------------------------------------- */

.hero{
  padding-bottom:49px;
}

.eyebrow{
  margin-bottom:13px;

  color:var(--muted);

  font-size:13px;
}

h1{
  margin:0;

  font-size:clamp(53px,8vw,96px);
  line-height:.9;

  font-weight:500;

  letter-spacing:-.065em;
}

.copy{
  max-width:650px;

  margin-top:28px;

  color:var(--muted);

  font-size:15px;
  line-height:1.55;
}


/* ---------------------------------------------------------
   tabs
   --------------------------------------------------------- */

.tabs{
  display:flex;
  gap:7px;

  padding:
    16px
    0;

  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.tab{
  padding:9px 13px;

  border:1px solid var(--line);
  border-radius:8px;

  font-size:13px;
}

.tab.active{
  background:#111;
  color:#fff;
  border-color:#111;
}


/* ---------------------------------------------------------
   controls
   --------------------------------------------------------- */

.controls{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:18px;

  padding:
    27px
    0
    18px;
}

.filter-title{
  display:flex;
  gap:9px;
  align-items:center;

  font-size:18px;
}

.search{
  width:min(300px,100%);

  border:1px solid var(--line);
  border-radius:9px;

  padding:11px 13px;

  outline:none;
}


/* ---------------------------------------------------------
   leaderboard
   --------------------------------------------------------- */

.board{
  border:
    1px solid var(--line);

  border-radius:14px;

  overflow:hidden;
}

.head,
.row{
  display:grid;

  grid-template-columns:
    74px
    minmax(0,1fr)
    150px;

  gap:18px;

  align-items:center;
}

.head{
  min-height:65px;

  padding:
    0
    24px;

  border-bottom:
    1px solid var(--line);

  font-size:13px;
  font-weight:600;
}

.row{
  min-height:112px;

  padding:
    17px
    24px;

  border-bottom:
    1px solid var(--line);
}

.row:last-child{
  border-bottom:0;
}

.rank{
  display:flex;
  align-items:center;
  gap:13px;

  font-size:20px;
}

.chevron{
  color:#777;

  font-size:23px;
  font-weight:300;
}

.identity{
  min-width:0;

  display:grid;

  grid-template-columns:
    40px
    minmax(0,1fr);

  gap:13px;

  align-items:center;
}

.logo{
  width:36px;
  height:36px;

  display:grid;
  place-items:center;
}

.logo img{
  max-width:31px;
  max-height:31px;

  object-fit:contain;
}

.logo-fallback{
  width:31px;
  height:31px;

  display:grid;
  place-items:center;

  border:1px solid var(--line);
  border-radius:50%;

  font-size:11px;
}

.model-name{
  display:block;

  font-size:18px;
  line-height:1.2;

  letter-spacing:-.02em;
}

.model-id{
  margin-top:4px;

  color:#444;

  font-size:12px;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
}

.provider{
  margin-top:6px;

  color:var(--muted);

  font-size:12px;
}

.provider a{
  text-decoration:underline;
  text-underline-offset:3px;
}

.score{
  text-align:right;

  font-variant-numeric:tabular-nums;
}

.score-main{
  font-size:24px;

  letter-spacing:-.03em;
}

.score-sub{
  margin-top:5px;

  color:var(--muted);

  font-size:11px;
}

.zero{
  color:#999;
}


/* ---------------------------------------------------------
   footer note
   --------------------------------------------------------- */

.note{
  margin-top:23px;

  color:var(--muted);

  font-size:11px;
  line-height:1.55;
}


/* ---------------------------------------------------------
   mobile
   --------------------------------------------------------- */

@media(max-width:700px){

  .nav{
    padding:
      0
      18px;
  }

  .nav-right{
    gap:14px;
  }

  main{
    padding:
      39px
      18px
      90px;
  }

  .controls{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    width:100%;
  }

  .head,
  .row{
    grid-template-columns:
      56px
      minmax(0,1fr)
      84px;

    gap:8px;
  }

  .head{
    padding:
      0
      13px;
  }

  .row{
    min-height:115px;

    padding:
      14px
      13px;
  }

  .identity{
    grid-template-columns:
      31px
      minmax(0,1fr);

    gap:9px;
  }

  .logo{
    width:29px;
    height:29px;
  }

  .logo img{
    max-width:25px;
    max-height:25px;
  }

  .model-name{
    font-size:15px;
  }

  .model-id{
    font-size:10px;
  }

  .provider{
    font-size:11px;
  }

  .score-main{
    font-size:19px;
  }

}


/* ==========================================================
   VOTING HISTORY
   ========================================================== */

.vote-chart-section{
  margin-bottom:42px;
  padding:31px 0 38px;
  border-bottom:1px solid var(--line);
}

.vote-chart-head{
  display:flex;
  justify-content:space-between;
  gap:24px;
  align-items:end;
  margin-bottom:24px;
}

.vote-chart-title{
  font-size:26px;
  letter-spacing:-.04em;
}

.vote-chart-copy{
  max-width:420px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  text-align:right;
}

.vote-chart-box{
  position:relative;
  height:360px;
  border-left:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.vote-grid{
  position:absolute;
  left:0;
  right:0;
  border-top:1px solid #ededeb;
}

.vote-chart-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

.vote-chart-legend{
  display:flex;
  flex-wrap:wrap;
  gap:11px 18px;
  margin-top:18px;
}

.vote-chart-legend-item{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
}

.vote-chart-line{
  width:21px;
  height:3px;
  border-radius:99px;
}

.vote-chart-empty{
  height:260px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:13px;
  color:var(--muted);
  font-size:13px;
}

@media(max-width:700px){

  .vote-chart-head{
    flex-direction:column;
    align-items:flex-start;
  }

  .vote-chart-copy{
    text-align:left;
  }

  .vote-chart-box{
    height:280px;
  }

}


/* =========================================================
   VOTING CURVE V2
   ========================================================= */

.vote-history{
  margin:32px 0 45px;
  padding-bottom:40px;
  border-bottom:1px solid var(--line);
}

.vote-history-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:30px;
  margin-bottom:25px;
}

.vote-history-title{
  font-size:27px;
  letter-spacing:-.04em;
}

.vote-history-sub{
  max-width:440px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  text-align:right;
}

.vote-chart-wrap{
  position:relative;
}

.vote-chart-box{
  position:relative;
  height:360px;
  border-left:1px solid var(--line);
  border-bottom:1px solid var(--line);
  overflow:visible;
}

.vote-chart-grid{
  position:absolute;
  left:0;
  right:0;
  border-top:1px solid #ecece9;
}

.vote-chart-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

.vote-y-label{
  position:absolute;
  left:8px;
  color:var(--muted);
  font-size:10px;
  transform:translateY(-50%);

}

.vote-chart-axis{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  color:var(--muted);
  font-size:10px;
}

.vote-chart-legend{
  margin-top:20px;

  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(190px,1fr));

  gap:10px 15px;
}

.vote-chart-legend-item{
  min-width:0;

  display:grid;
  grid-template-columns:26px minmax(0,1fr) auto;

  gap:8px;
  align-items:center;

  color:var(--muted);
  font-size:11px;
}

.vote-legend-logo{
  width:26px;
  height:26px;

  display:grid;
  place-items:center;

  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
}

.vote-legend-logo img{
  width:19px;
  height:19px;
  object-fit:contain;
}

.vote-legend-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.vote-legend-score{
  color:#111;
  font-variant-numeric:tabular-nums;
}

.vote-chart-empty{
  min-height:230px;

  display:grid;
  place-items:center;

  border:1px solid var(--line);
  border-radius:13px;

  color:var(--muted);
  font-size:13px;
}

.vote-dot{
  filter:
    drop-shadow(0 1px 1px rgba(0,0,0,.08));
}


/* leaderboard logos */

.logo{
  border-radius:8px;
  background:#fff;
}

.logo img{
  width:28px !important;
  height:28px !important;
  max-width:28px !important;
  max-height:28px !important;
  object-fit:contain;
}


/* top-three rank emphasis */

.row[data-rank="1"] .rank strong,
.row[data-rank="2"] .rank strong,
.row[data-rank="3"] .rank strong{
  font-weight:650;
}

@media(max-width:700px){

  .vote-history-head{
    align-items:flex-start;
    flex-direction:column;
    gap:8px;
  }

  .vote-history-sub{
    text-align:left;
  }

  .vote-chart-box{
    height:285px;
  }

  .vote-chart-legend{
    grid-template-columns:1fr;
  }

}


/* =========================================================
   STABLE VOTING TREND
   ========================================================= */

.stable-vote-history{

}

.stable-vote-head{

  justify-content:space-between;
  align-items:end;

.stable-vote-title{

.stable-vote-sub{

}

.stable-vote-count{

}

.stable-vote-chart{

.stable-vote-grid{

}

  inset:0;

  height:100%;

}

.stable-vote-axis{

  justify-content:space-between;

}

.stable-vote-legend{
  margin-top:20px;

}

.stable-vote-legend-item{

  grid-template-columns:

.stable-vote-logo{

.stable-vote-score{

@media(max-width:700px){

<script src="../models.js?v=1788116237"></script>
<script src="./votes.js?v=1788116237"></script>

<script>
window.addEventListener(
  "zorixVotingDataReady",
  ()=>{
const models =
  window.ZORIX_MODEL_DETAILS || [];

const voteData =
  window.ZORIX_COMMUNITY_VOTES || {
    models:[]
  };


const providerRoutes = {
  "Zorix":"/zorix/",
  "Anthropic":"/anthropic/",
  "OpenAI":"/openai/",
  "Google":"/google/",
  "DeepSeek":"/deepseek/",
  "Tencent":"/tencent/",
  "Xiaomi":"/xiaomi/",
  "Z.ai":"/zai/"
};


const voteMap =
  new Map(
    voteData.models.map(
      x=>[
        x.id,
        {
          votes:Number(x.votes || 0),
          uncertainty:Number(
            x.uncertainty || 0
          )
        }
      ]
    )
  );


const merged =
  models.map(
    (m,index)=>{

      const vote =
        voteMap.get(m.id) || {
          votes:0,
          uncertainty:0
        };

      return {
        ...m,
        votes:vote.votes,
        uncertainty:vote.uncertainty,
        originalIndex:index
      };

    }
  );


function providerLink(model){

  const route =
    providerRoutes[
      model.provider
    ];

  if(!route)
    return model.provider;

  return `
    <a href="${route}">
      ${model.provider}
    </a>
  `;

}



function resolveModelLogo(model){

  const logo = String(
    model?.logo || ""
  );

  if(!logo){
    return "";
  }

  if(logo.startsWith("/")){
    return logo;
  }

  if(logo.startsWith("./assets/")){
    return "/number-of-calls/" + logo.slice(2);
  }

  if(logo.startsWith("assets/")){
    return "/number-of-calls/" + logo;
  }

  return logo;
}


function logoHTML(model){

  const src =
    resolveModelLogo(model);

  if(src){

    return `
      <img
        src="${src}"
        alt=""
        loading="lazy"
      >
    `;

  }

  return `
    <span class="logo-fallback">
      ${String(
        model.provider || "?"
      ).slice(0,1)}
    </span>
  `;

}


function fmtVotes(n){

  return Number(n)
    .toLocaleString(
      "en-US"
    );

}


function render(){

  const query =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const visible =
    merged
      .filter(
        m=>
          !query ||
          m.name
            .toLowerCase()
            .includes(query) ||
          m.provider
            .toLowerCase()
            .includes(query) ||
          m.id
            .toLowerCase()
            .includes(query)
      )
      .sort(
        (a,b)=>
          b.votes-a.votes ||
          a.originalIndex-b.originalIndex
      );


  document
    .getElementById(
      "rows"
    )
    .innerHTML =
      visible.map(
        (m,index)=>`

          <article
            class="row"
            data-rank="${index+1}"
          >

            <div class="rank">

              <span class="chevron">
                ›
              </span>

              <strong>
                ${index+1}
              </strong>

            </div>


            <div class="identity">

              <a
                class="logo"
                href="../model.html?id=${encodeURIComponent(m.id)}"
              >
                ${logoHTML(m)}
              </a>


              <div>

                <a
                  class="model-name"
                  href="../model.html?id=${encodeURIComponent(m.id)}"
                >
                  ${m.name}
                </a>

                <div class="model-id">
                  ${m.id}
                </div>

                <div class="provider">
                  ${providerLink(m)}
                  ·
                  ${m.architecture === "Closed"
                    || String(
                      m.architecture || ""
                    ).startsWith("Closed")
                    ? "Proprietary"
                    : m.architecture || "Model"
                  }
                </div>

              </div>

            </div>


            <div
              class="score ${
                m.votes === 0
                  ? "zero"
                  : ""
              }"
            >

              <div class="score-main">
                ${fmtVotes(m.votes)}
              </div>

              <div class="score-sub">

                ${
                  m.uncertainty > 0
                    ? `±${m.uncertainty}`
                    : "votes"
                }

              </div>

            </div>

          </article>

        `
      )
      .join("");

}


document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    render
  );


if(voteData.updatedAt){

  const d =
    new Date(
      voteData.updatedAt
    );

  document
    .getElementById(
      "updated"
    )
    .textContent =
      "Vote totals last updated " +
      d.toLocaleString() +
      ". Usage and benchmark rankings are calculated separately.";

}else{

  document
    .getElementById(
      "updated"
    )
    .textContent =
      "Vote totals have not been published yet.";

}



const voteHistory =
  Array.isArray(voteData.history)
    ? voteData.history
    : [];


function voteColor(model,index){

  const palette=[
    "#2563EB",
    "#D97757",
    "#4D6BFE",
    "#4285F4",
    "#00A7CE",
    "#10A37F",
    "#8B5CF6",
    "#E0A11A",
    "#FF6900"
  ];

  return (
    model.color ||
    palette[
      index %
      palette.length
    ]
  );

}


function historyValue(
  snapshot,
  modelId
){

  const model =
    snapshot?.models?.[
      modelId
    ];

  return Number(
    model?.votes || 0
  );

}


function linePoints(
  values,
  min,
  max
){

  if(!values.length)
    return "";

  const range =
    Math.max(
      1,
      max-min
    );


  return values.map(
    (v,index)=>{

      const x =
        values.length === 1
          ? 500
          : index /
            (values.length-1) *
            1000;

      const normalized =
        (v-min) /
        range;

      const y =
        320 -
        normalized*290;

      return (
        x.toFixed(2) +
        "," +
        y.toFixed(2)
      );

    }
  ).join(" ");

}


function renderVoteHistory(){

  const container =
    document.getElementById(
      "voteChartContainer"
    );

  const svg =
    document.getElementById(
      "voteHistoryChart"
    );

  const legend =
    document.getElementById(
      "voteHistoryLegend"
    );


  if(
    !container ||
    !svg ||
    !legend
  ){
    return;
  }


  if(
    voteHistory.length < 1
  ){

    container.innerHTML=`
      <div class="vote-chart-empty">
        Voting history will appear after the first update.
      </div>
    `;

    return;
  }


  const ranked =
    [...merged]
      .sort(
        (a,b)=>
          b.votes-a.votes
      )
      .filter(
        m=>m.votes>0
      )
      .slice(
        0,
        8
      );


  const allValues=[];


  ranked.forEach(
    model=>{

      voteHistory.forEach(
        snapshot=>{

          allValues.push(
            historyValue(
              snapshot,
              model.id
            )
          );

        }
      );

    }
  );


  const rawMin =
    Math.min(
      ...allValues,
      0
    );

  const rawMax =
    Math.max(
      ...allValues,
      1
    );


  /*
   * For close Elo-like vote totals, don't force
   * the chart down to zero. This makes movement visible.
   */
  const min =
    rawMax > 100 &&
    rawMin > rawMax*.5
      ? Math.max(
          0,
          rawMin -
          (rawMax-rawMin)*.2 -
          10
        )
      : 0;


  const max =
    rawMax +
    Math.max(
      10,
      (rawMax-min)*.06
    );


  svg.innerHTML =
    ranked.map(
      (model,index)=>{

        const values =
          voteHistory.map(
            snapshot=>
              historyValue(
                snapshot,
                model.id
              )
          );

        return `
          <polyline
            points="${
              linePoints(
                values,
                min,
                max
              )
            }"
            fill="none"
            stroke="${
              voteColor(
                model,
                index
              )
            }"
            stroke-width="4"
            vector-effect="non-scaling-stroke"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        `;

      }
    ).join("");


  legend.innerHTML =
    ranked.map(
      (model,index)=>`
        <div class="vote-chart-legend-item">

          <span
            class="vote-chart-line"
            style="
              background:${
                voteColor(
                  model,
                  index
                )
              }
            "
          ></span>

          <span>
            ${model.name}
          </span>

        </div>
      `
    ).join("");

}
/* =========================================================
   Voting curve renderer V2
   ========================================================= */

function voteCurveColor(model,index){

  const palette=[
    "#2563EB",
    "#D97757",
    "#4D6BFE",
    "#4285F4",
    "#00A7CE",
    "#10A37F",
    "#8B5CF6",
    "#E0A11A"
  ];

  return (
    model.color ||
    palette[
      index %
      palette.length
    ]
  );
}


function voteSnapshotValue(
  snapshot,
  modelId
){

  return Number(
    snapshot?.models?.[
      modelId
    ]?.votes || 0
  );

}


function votePointXY(
  value,
  index,
  length,
  min,
  max
){

  const x =
    length <= 1
      ? 500
      : index /
        (length-1) *
        1000;

  const range =
    Math.max(
      1,
      max-min
    );

  const y =
    320 -
    (
      (value-min) /
      range
    ) *
    290;

  return {
    x,
    y
  };
}


function renderVoteCurveV2(){

  const svg =
    document.getElementById(
      "voteHistoryChart"
    );

  const legend =
    document.getElementById(
      "voteHistoryLegend"
    );

  const axis =
    document.getElementById(
      "voteChartAxis"
    );

  const wrap =
    document.getElementById(
      "voteChartWrap"
    );


  if(
    !svg ||
    !legend ||
    !axis ||
    !wrap
  ){
    return;
  }


  const history =
    Array.isArray(
      voteData.history
    )
      ? voteData.history
      : [];


  if(!history.length){

    wrap.innerHTML=`
      <div class="vote-chart-empty">
        No voting history yet.
      </div>
    `;

    return;
  }


  const ranked =
    [...merged]
      .filter(
        m=>
          Number(m.votes || 0) > 0
      )
      .sort(
        (a,b)=>
          Number(b.votes || 0) -
          Number(a.votes || 0)
      )
      .slice(0,8);


  if(!ranked.length){

    wrap.innerHTML=`
      <div class="vote-chart-empty">
        Vote totals will appear here
        after the first ranked update.
      </div>
    `;

    return;
  }


  const all=[];


  ranked.forEach(
    model=>{

      history.forEach(
        snapshot=>{

          const value =
            voteSnapshotValue(
              snapshot,
              model.id
            );

          if(value > 0){
            all.push(value);
          }

        }
      );

    }
  );


  const rawMin =
    all.length
      ? Math.min(...all)
      : 0;

  const rawMax =
    all.length
      ? Math.max(...all)
      : 1;


  /*
   * For voting scores around 1500,
   * crop the baseline so changes remain visible.
   */
  const padding =
    Math.max(
      20,
      (
        rawMax-rawMin
      )*.18
    );


  const min =
    Math.max(
      0,
      rawMin-padding
    );

  const max =
    rawMax+padding;


  const pieces=[];


  ranked.forEach(
    (model,modelIndex)=>{

      const values =
        history.map(
          snapshot=>
            voteSnapshotValue(
              snapshot,
              model.id
            )
        );


      const nonzero =
        values.filter(
          x=>x>0
        );


      if(!nonzero.length)
        return;


      const color =
        voteCurveColor(
          model,
          modelIndex
        );


      /*
       * One snapshot:
       * draw a visible circle instead of an invisible polyline.
       */
      if(values.length === 1){

        const point =
          votePointXY(
            values[0],
            0,
            1,
            min,
            max
          );

        /*
         * One real snapshot cannot form a historical line.
         * Draw a horizontal guide + large endpoint instead,
         * so the current voting position is still visible.
         */
        pieces.push(`
          <line
            x1="60"
            y1="${point.y}"
            x2="940"
            y2="${point.y}"
            stroke="${color}"
            stroke-width="3"
            stroke-opacity=".28"
            stroke-dasharray="7 7"
            vector-effect="non-scaling-stroke"
          />

          <circle
            class="vote-dot"
            cx="${point.x}"
            cy="${point.y}"
            r="9"
            fill="#fff"
            stroke="${color}"
            stroke-width="5"
            vector-effect="non-scaling-stroke"
          />
        `);

        return;
      }


      const points =
        values.map(
          (value,index)=>{

            const point =
              votePointXY(
                value,
                index,
                values.length,
                min,
                max
              );

            return (
              point.x.toFixed(2) +
              "," +
              point.y.toFixed(2)
            );

          }
        ).join(" ");


      pieces.push(`
        <polyline
          points="${points}"
          fill="none"
          stroke="${color}"
          stroke-width="4"
          vector-effect="non-scaling-stroke"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      `);


      values.forEach(
        (value,index)=>{

          const point =
            votePointXY(
              value,
              index,
              values.length,
              min,
              max
            );


          pieces.push(`
            <circle
              class="vote-dot"
              cx="${point.x}"
              cy="${point.y}"
              r="4.5"
              fill="#fff"
              stroke="${color}"
              stroke-width="3"
              vector-effect="non-scaling-stroke"
            />
          `);

        }
      );

    }
  );


  svg.innerHTML =
    pieces.join("");


  const firstDate =
    history[0]?.at
      ? new Date(
          history[0].at
        )
      : null;

  const lastDate =
    history[
      history.length-1
    ]?.at
      ? new Date(
          history[
            history.length-1
          ].at
        )
      : null;


  const dateText =
    d=>
      d &&
      !Number.isNaN(
        d.getTime()
      )
        ? d.toLocaleString(
            undefined,
            {
              month:"short",
              day:"numeric",
              hour:"2-digit",
              minute:"2-digit"
            }
          )
        : "—";


  axis.innerHTML = `
    <span>
      ${dateText(firstDate)}
    </span>

    <span>
      ${
        history.length === 1
          ? "Current snapshot"
          : history.length +
            " snapshots"
      }
    </span>

    <span>
      ${dateText(lastDate)}
    </span>
  `;


  legend.innerHTML =
    ranked.map(
      (model,index)=>`

        <div class="vote-chart-legend-item">

          <span class="vote-legend-logo">

            ${
              resolveModelLogo(model)
                ? `
                  <img
                    src="${
                      resolveModelLogo(
                        model
                      )
                    }"
                    alt=""
                  >
                `
                : String(
                    model.provider || "?"
                  ).slice(0,1)
            }

          </span>

          <span class="vote-legend-name">
            ${model.name}
          </span>

          <span class="vote-legend-score">
            ${
              Number(
                model.votes || 0
              ).toLocaleString()
            }
          </span>

        </div>

      `
    ).join("");

}
render();
}
);
</script>


<script>
/* ZORIX_SAFE_VOTING_READY */
window.addEventListener("DOMContentLoaded", function(){
  window.dispatchEvent(
    new Event("zorixVotingDataReady")
  );
});



/* =========================================================
   Stable voting trend renderer
   ========================================================= */

function stableVoteLogo(model){

  let src = String(
    model?.logo || ""
  );

  if(!src)
    return "";

  if(src.startsWith("./assets/")){
    src =
      "/number-of-calls/" +
      src.slice(2);
  }

  if(src.startsWith("assets/")){
    src =
      "/number-of-calls/" +
      src;
  }

  return src;
}


function renderStableVotingTrend(){

  const svg =
    document.getElementById(
      "stableVoteSvg"
    );

  const legend =
    document.getElementById(
      "stableVoteLegend"
    );

  const axis =
    document.getElementById(
      "stableVoteAxis"
    );

  const count =
    document.getElementById(
      "stableVoteCount"
    );


  if(
    !svg ||
    !legend ||
    !axis
  ){
    return;
  }


  const voting =
    window.ZORIX_COMMUNITY_VOTES || {
      models:[],
      history:[]
    };


  const catalog =
    window.ZORIX_MODEL_DETAILS || [];


  const history =
    Array.isArray(voting.history)
      ? voting.history
      : [];


  /*
   * IMPORTANT:
   * Build chart models from VOTES,
   * not from merged leaderboard state.
   */
  const ranked =
    [...(voting.models || [])]
      .filter(
        x=>
          Number(x.votes || 0) > 0
      )
      .sort(
        (a,b)=>
          Number(b.votes || 0) -
          Number(a.votes || 0)
      )
      .slice(0,8)
      .map(
        vote=>{

          const info =
            catalog.find(
              model=>
                model.id === vote.id
            ) || {};

          return {
            id:vote.id,

            votes:
              Number(
                vote.votes || 0
              ),

            uncertainty:
              Number(
                vote.uncertainty || 0
              ),

            name:
              info.name ||
              vote.id,

            provider:
              info.provider ||
              "Unknown",

            logo:
              info.logo || "",

            color:
              info.color || ""
          };

        }
      );


  count.textContent =
    history.length === 1
      ? "1 snapshot"
      : `${history.length} snapshots`;


  if(!ranked.length){

    svg.innerHTML="";

    legend.innerHTML=`
      <div style="
        color:var(--muted);
        font-size:13px;
      ">
        No ranked voting models yet.
      </div>
    `;

    return;
  }


  const palette=[
    "#2563EB",
    "#D97757",
    "#4D6BFE",
    "#4285F4",
    "#00A7CE",
    "#10A37F",
    "#8B5CF6",
    "#E0A11A"
  ];


  function colorFor(
    model,
    index
  ){

    return (
      model.color ||
      palette[
        index %
        palette.length
      ]
    );

  }


  function historyValues(model){

    /*
     * If there's no history, still use current votes.
     */
    if(!history.length){
      return [
        model.votes
      ];
    }


    return history.map(
      snapshot=>{

        const entry =
          snapshot?.models?.[
            model.id
          ];

        /*
         * Older snapshots may not contain
         * a newly-added model.
         *
         * Use null rather than fake zero.
         */
        if(!entry)
          return null;

        return Number(
          entry.votes || 0
        );

      }
    );

  }


  const allValues=[];


  ranked.forEach(
    model=>{

      historyValues(model)
        .forEach(
          value=>{

            if(
              value !== null &&
              Number.isFinite(value) &&
              value > 0
            ){
              allValues.push(value);
            }

          }
        );

    }
  );


  /*
   * Current votes are ALWAYS included,
   * so 1-snapshot pages still render correctly.
   */
  ranked.forEach(
    model=>
      allValues.push(
        model.votes
      )
  );


  const rawMin =
    Math.min(...allValues);

  const rawMax =
    Math.max(...allValues);


  const difference =
    Math.max(
      1,
      rawMax-rawMin
    );


  const padding =
    Math.max(
      15,
      difference*.25
    );


  const min =
    Math.max(
      0,
      rawMin-padding
    );

  const max =
    rawMax+padding;


  function point(
    value,
    index,
    length
  ){

    const x =
      length <= 1
        ? 500
        : 40 +
          index /
          (length-1) *
          920;


    const y =
      315 -
      (
        (value-min) /
        Math.max(
          1,
          max-min
        )
      ) *
      285;


    return {
      x,
      y
    };

  }


  const output=[];


  ranked.forEach(
    (model,modelIndex)=>{

      let values =
        historyValues(model);


      /*
       * Drop missing snapshots.
       */
      values =
        values.filter(
          value=>
            value !== null &&
            Number.isFinite(value) &&
            value > 0
        );


      /*
       * Current value is authoritative.
       *
       * If latest history snapshot is older than
       * current votes, append current score as
       * another visible point.
       */
      if(
        !values.length ||
        values[
          values.length-1
        ] !== model.votes
      ){
        values.push(
          model.votes
        );
      }


      const color =
        colorFor(
          model,
          modelIndex
        );


      /*
       * ONE point:
       * render a visible horizontal guide
       * and endpoint.
       */
      if(values.length === 1){

        const pt =
          point(
            values[0],
            0,
            1
          );


        output.push(`
          <line
            x1="70"
            y1="${pt.y}"
            x2="930"
            y2="${pt.y}"
            stroke="${color}"
            stroke-width="3"
            stroke-opacity=".24"
            stroke-dasharray="8 8"
            vector-effect="non-scaling-stroke"
          />

          <circle
            cx="${pt.x}"
            cy="${pt.y}"
            r="9"
            fill="#fff"
            stroke="${color}"
            stroke-width="5"
            vector-effect="non-scaling-stroke"
          />
        `);

        return;
      }


      const points =
        values.map(
          (value,index)=>{

            const pt =
              point(
                value,
                index,
                values.length
              );

            return (
              pt.x.toFixed(2)
              + ","
              + pt.y.toFixed(2)
            );

          }
        ).join(" ");


      output.push(`
        <polyline
          points="${points}"
          fill="none"
          stroke="${color}"
          stroke-width="4"
          vector-effect="non-scaling-stroke"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      `);


      values.forEach(
        (value,index)=>{

          const pt =
            point(
              value,
              index,
              values.length
            );


          output.push(`
            <circle
              cx="${pt.x}"
              cy="${pt.y}"
              r="4.5"
              fill="#fff"
              stroke="${color}"
              stroke-width="3"
              vector-effect="non-scaling-stroke"
            />
          `);

        }
      );

    }
  );


  svg.innerHTML =
    output.join("");


  /*
   * Legend — derived directly from current
   * non-zero voting models.
   */
  legend.innerHTML =
    ranked.map(
      (model,index)=>{

        const logo =
          stableVoteLogo(
            model
          );


        return `
          <div class="stable-vote-legend-item">

            <div class="stable-vote-logo">

              ${
                logo
                  ? `
                    <img
                      src="${logo}"
                      alt=""
                    >
                  `
                  : model.provider
                    .slice(0,1)
              }

            </div>


            <div class="stable-vote-name">

              ${model.name}

              <span class="stable-vote-provider">
                ${model.provider}
              </span>

            </div>


            <div
              class="stable-vote-score"
              style="
                color:${
                  colorFor(
                    model,
                    index
                  )
                }
              "
            >

              ${model.votes.toLocaleString()}

              ${
                model.uncertainty
                  ? ` ±${model.uncertainty}`
                  : ""
              }

            </div>

          </div>
        `;

      }
    ).join("");


  function dateLabel(value){

    if(!value)
      return "Current";

    const date =
      new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){
      return "Current";
    }


    return date.toLocaleString(
      undefined,
      {
        month:"short",
        day:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }


  if(!history.length){

    axis.innerHTML=`
      <span>Current</span>
      <span>Current voting scores</span>
      <span>Current</span>
    `;

  }else if(history.length === 1){

    axis.innerHTML=`
      <span>
        ${dateLabel(history[0].at)}
      </span>

      <span>
        Current snapshot
      </span>

      <span>
        Current
      </span>
    `;

  }else{

    axis.innerHTML=`
      <span>
        ${
          dateLabel(
            history[0].at
          )
        }
      </span>

      <span>
        ${history.length} snapshots
      </span>

      <span>
        ${
          dateLabel(
            history[
              history.length-1
            ].at
          )
        }
      </span>
    `;

  }

}

</script>


<script>
window.addEventListener(
  "load",
  function(){

    if(
      typeof renderStableVotingTrend
      ===
      "function"
    ){
      renderStableVotingTrend();
    }

  }
);
</script>
