<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Community voting | Zorix Code</title>

<style>

:root{
  --bg:#fff;
  --text:#111;
  --muted:#696966;
  --line:#deded9;
  --soft:#f7f7f4;
  --max:1080px;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body{
  margin:0;

  background:var(--bg);
  color:var(--text);

  font-family:
    "OpenAI Sans",
    "Inter",
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

  letter-spacing:-.012em;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
  color:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:30;

  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);

  border-bottom:1px solid var(--line);
}

.nav{
  max-width:var(--max);
  height:66px;

  margin:auto;
  padding:0 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:20px;
  font-weight:600;
  letter-spacing:-.045em;
}

.nav-right{
  display:flex;
  gap:23px;

  align-items:center;

  font-size:13px;
}

main{
  max-width:var(--max);

  margin:auto;

  padding:
    58px
    24px
    120px;
}


/* ---------------------------------------------------------
   hero
   --------------------------------------------------------- */

.hero{
  padding-bottom:49px;
}

.eyebrow{
  margin-bottom:13px;

  color:var(--muted);

  font-size:13px;
}

h1{
  margin:0;

  font-size:clamp(53px,8vw,96px);
  line-height:.9;

  font-weight:500;

  letter-spacing:-.065em;
}

.copy{
  max-width:650px;

  margin-top:28px;

  color:var(--muted);

  font-size:15px;
  line-height:1.55;
}


/* ---------------------------------------------------------
   tabs
   --------------------------------------------------------- */

.tabs{
  display:flex;
  gap:7px;

  padding:
    16px
    0;

  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.tab{
  padding:9px 13px;

  border:1px solid var(--line);
  border-radius:8px;

  font-size:13px;
}

.tab.active{
  background:#111;
  color:#fff;
  border-color:#111;
}


/* ---------------------------------------------------------
   controls
   --------------------------------------------------------- */

.controls{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:18px;

  padding:
    27px
    0
    18px;
}

.filter-title{
  display:flex;
  gap:9px;
  align-items:center;

  font-size:18px;
}

.search{
  width:min(300px,100%);

  border:1px solid var(--line);
  border-radius:9px;

  padding:11px 13px;

  outline:none;
}


/* ---------------------------------------------------------
   leaderboard
   --------------------------------------------------------- */

.board{
  border:
    1px solid var(--line);

  border-radius:14px;

  overflow:hidden;
}

.head,
.row{
  display:grid;

  grid-template-columns:
    74px
    minmax(0,1fr)
    150px;

  gap:18px;

  align-items:center;
}

.head{
  min-height:65px;

  padding:
    0
    24px;

  border-bottom:
    1px solid var(--line);

  font-size:13px;
  font-weight:600;
}

.row{
  min-height:112px;

  padding:
    17px
    24px;

  border-bottom:
    1px solid var(--line);
}

.row:last-child{
  border-bottom:0;
}

.rank{
  display:flex;
  align-items:center;
  gap:13px;

  font-size:20px;
}

.chevron{
  color:#777;

  font-size:23px;
  font-weight:300;
}

.identity{
  min-width:0;

  display:grid;

  grid-template-columns:
    40px
    minmax(0,1fr);

  gap:13px;

  align-items:center;
}

.logo{
  width:36px;
  height:36px;

  display:grid;
  place-items:center;
}

.logo img{
  max-width:31px;
  max-height:31px;

  object-fit:contain;
}

.logo-fallback{
  width:31px;
  height:31px;

  display:grid;
  place-items:center;

  border:1px solid var(--line);
  border-radius:50%;

  font-size:11px;
}

.model-name{
  display:block;

  font-size:18px;
  line-height:1.2;

  letter-spacing:-.02em;
}

.model-id{
  margin-top:4px;

  color:#444;

  font-size:12px;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
}

.provider{
  margin-top:6px;

  color:var(--muted);

  font-size:12px;
}

.provider a{
  text-decoration:underline;
  text-underline-offset:3px;
}

.score{
  text-align:right;

  font-variant-numeric:tabular-nums;
}

.score-main{
  font-size:24px;

  letter-spacing:-.03em;
}

.score-sub{
  margin-top:5px;

  color:var(--muted);

  font-size:11px;
}

.zero{
  color:#999;
}


/* ---------------------------------------------------------
   footer note
   --------------------------------------------------------- */

.note{
  margin-top:23px;

  color:var(--muted);

  font-size:11px;
  line-height:1.55;
}


/* ---------------------------------------------------------
   mobile
   --------------------------------------------------------- */

@media(max-width:700px){

  .nav{
    padding:
      0
      18px;
  }

  .nav-right{
    gap:14px;
  }

  main{
    padding:
      39px
      18px
      90px;
  }

  .controls{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    width:100%;
  }

  .head,
  .row{
    grid-template-columns:
      56px
      minmax(0,1fr)
      84px;

    gap:8px;
  }

  .head{
    padding:
      0
      13px;
  }

  .row{
    min-height:115px;

    padding:
      14px
      13px;
  }

  .identity{
    grid-template-columns:
      31px
      minmax(0,1fr);

    gap:9px;
  }

  .logo{
    width:29px;
    height:29px;
  }

  .logo img{
    max-width:25px;
    max-height:25px;
  }

  .model-name{
    font-size:15px;
  }

  .model-id{
    font-size:10px;
  }

  .provider{
    font-size:11px;
  }

  .score-main{
    font-size:19px;
  }

}

</style>

</head>


<body>

<header>

  <nav class="nav">

    <a
      class="brand"
      href="../"
    >
      zorix
    </a>

    <div class="nav-right">

      <a href="../">
        Usage
      </a>

      <a href="../#benchmarks">
        Benchmarks
      </a>

      <a href="./">
        Voting
      </a>

    </div>

  </nav>

</header>


<main>

<section class="hero">

  <div class="eyebrow">
    Zorix Code
  </div>

  <h1>
    Community<br>
    voting
  </h1>

  <p class="copy">
    A separate community ranking based on recorded votes.
    Vote totals are maintained independently from model usage
    and benchmark results.
  </p>

</section>


<nav class="tabs">

  <a
    class="tab"
    href="../"
  >
    Usage
  </a>

  <a
    class="tab"
    href="../#benchmarks"
  >
    Benchmarks
  </a>

  <a
    class="tab active"
    href="./"
  >
    Voting
  </a>

</nav>


<div class="controls">

  <div class="filter-title">
    ☷
    <span>Models</span>
  </div>

  <input
    class="search"
    id="search"
    type="search"
    placeholder="Search models"
    autocomplete="off"
  >

</div>


<section class="board">

  <div class="head">

    <div>
      Rank
    </div>

    <div>
      Model
    </div>

    <div style="text-align:right">
      Votes ↓
    </div>

  </div>

  <div id="rows"></div>

</section>


<div
  class="note"
  id="updated"
></div>

</main>


<script src="../models.js?v=1788114075"></script>
<script src="./votes.js?v=1788114075"></script>

<script>

const models =
  window.ZORIX_MODEL_DETAILS || [];

const voteData =
  window.ZORIX_COMMUNITY_VOTES || {
    models:[]
  };


const providerRoutes = {
  "Zorix":"/zorix/",
  "Anthropic":"/anthropic/",
  "OpenAI":"/openai/",
  "Google":"/google/",
  "DeepSeek":"/deepseek/",
  "Tencent":"/tencent/",
  "Xiaomi":"/xiaomi/",
  "Z.ai":"/zai/"
};


const voteMap =
  new Map(
    voteData.models.map(
      x=>[
        x.id,
        {
          votes:Number(x.votes || 0),
          uncertainty:Number(
            x.uncertainty || 0
          )
        }
      ]
    )
  );


const merged =
  models.map(
    (m,index)=>{

      const vote =
        voteMap.get(m.id) || {
          votes:0,
          uncertainty:0
        };

      return {
        ...m,
        votes:vote.votes,
        uncertainty:vote.uncertainty,
        originalIndex:index
      };

    }
  );


function providerLink(model){

  const route =
    providerRoutes[
      model.provider
    ];

  if(!route)
    return model.provider;

  return `
    <a href="${route}">
      ${model.provider}
    </a>
  `;

}


function logoHTML(model){

  if(model.logo){

    return `
      <img
        src="${model.logo}"
        alt=""
      >
    `;

  }

  return `
    <span class="logo-fallback">
      ${String(
        model.provider || "?"
      ).slice(0,1)}
    </span>
  `;

}


function fmtVotes(n){

  return Number(n)
    .toLocaleString(
      "en-US"
    );

}


function render(){

  const query =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const visible =
    merged
      .filter(
        m=>
          !query ||
          m.name
            .toLowerCase()
            .includes(query) ||
          m.provider
            .toLowerCase()
            .includes(query) ||
          m.id
            .toLowerCase()
            .includes(query)
      )
      .sort(
        (a,b)=>
          b.votes-a.votes ||
          a.originalIndex-b.originalIndex
      );


  document
    .getElementById(
      "rows"
    )
    .innerHTML =
      visible.map(
        (m,index)=>`

          <article class="row">

            <div class="rank">

              <span class="chevron">
                ›
              </span>

              <strong>
                ${index+1}
              </strong>

            </div>


            <div class="identity">

              <a
                class="logo"
                href="../model.html?id=${encodeURIComponent(m.id)}"
              >
                ${logoHTML(m)}
              </a>


              <div>

                <a
                  class="model-name"
                  href="../model.html?id=${encodeURIComponent(m.id)}"
                >
                  ${m.name}
                </a>

                <div class="model-id">
                  ${m.id}
                </div>

                <div class="provider">
                  ${providerLink(m)}
                  ·
                  ${m.architecture === "Closed"
                    || String(
                      m.architecture || ""
                    ).startsWith("Closed")
                    ? "Proprietary"
                    : m.architecture || "Model"
                  }
                </div>

              </div>

            </div>


            <div
              class="score ${
                m.votes === 0
                  ? "zero"
                  : ""
              }"
            >

              <div class="score-main">
                ${fmtVotes(m.votes)}
              </div>

              <div class="score-sub">

                ${
                  m.uncertainty > 0
                    ? `±${m.uncertainty}`
                    : "votes"
                }

              </div>

            </div>

          </article>

        `
      )
      .join("");

}


document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    render
  );


if(voteData.updatedAt){

  const d =
    new Date(
      voteData.updatedAt
    );

  document
    .getElementById(
      "updated"
    )
    .textContent =
      "Vote totals last updated " +
      d.toLocaleString() +
      ". Usage and benchmark rankings are calculated separately.";

}else{

  document
    .getElementById(
      "updated"
    )
    .textContent =
      "Vote totals have not been published yet.";

}


render();

</script>

</body>
</html>
