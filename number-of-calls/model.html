<!doctype html>
<html lang="en">

<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="zorix-build" content="1788181089">






<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="robots"
  content="noindex"
>

<title>
Model moved | Zorix Metron
</title>

<style>

body{
  margin:0;

  min-height:100vh;

  display:grid;
  place-items:center;

  background:#fff;
  color:#111;

  font-family:
    "OpenAI Sans",
    "Inter",
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;
}

main{
  max-width:520px;

  padding:30px;

  text-align:center;
}

p{
  color:#70706a;

  line-height:1.55;
}

a{
  color:#111;
}

</style>

</head>


<body>

<main>

  <h1>
    Model page moved
  </h1>

  <p>
    Zorix Metron now uses permanent
    path-based model URLs.
  </p>

  <p>
    <a href="./models/">
      Open model catalog
    </a>
  </p>

</main>


<script>

(function(){

  const id =
    new URLSearchParams(
      location.search
    )
    .get(
      "id"
    );


  if(!id){
    return;
  }


  location.replace(
    "/number-of-calls/models/"
    +
    encodeURIComponent(id)
    +
    "/"
  );

})();

</script>

</body>
</html>
