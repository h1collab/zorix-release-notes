<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model | Zorix Code</title>

<style>
:root{
  --bg:#fff;
  --text:#0d0d0d;
  --muted:#6b6b67;
  --line:#deded9;
  --soft:#f7f7f5;
  --max:1180px;
}

*{box-sizing:border-box}

html{-webkit-font-smoothing:antialiased}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    "OpenAI Sans",
    "Inter",
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;
  letter-spacing:-.01em;
}

a{color:inherit;text-decoration:none}

header{
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:var(--max);
  margin:auto;
  height:64px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:20px;
  font-weight:600;
  letter-spacing:-.045em;
}

.nav-links{
  display:flex;
  gap:24px;
  font-size:14px;
}

main{
  max-width:var(--max);
  margin:auto;
  padding:72px 24px 120px;
}

.back{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:14px;
  color:var(--muted);
  margin-bottom:64px;
}

.model-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:40px;
  align-items:start;
  padding-bottom:48px;
  border-bottom:1px solid var(--line);
}

.identity{
  display:flex;
  gap:20px;
  align-items:flex-start;
}

.logo-box{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}

.logo-box img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.logo-fallback{
  width:48px;
  height:48px;
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:18px;
}

.provider{
  color:var(--muted);
  font-size:14px;
  margin-bottom:10px;
}

h1{
  font-size:clamp(42px,6vw,76px);
  line-height:.98;
  letter-spacing:-.055em;
  font-weight:500;
  margin:0;
  max-width:850px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:22px;
}

.tag{
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:13px;
}

.daily{
  text-align:right;
}

.daily-label{
  color:var(--muted);
  font-size:13px;
}

.daily-value{
  margin-top:10px;
  font-size:28px;
  letter-spacing:-.04em;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid var(--line);
}

.metric{
  min-height:155px;
  padding:31px 0;
  border-right:1px solid var(--line);
}

.metric:not(:first-child){padding-left:28px}
.metric:last-child{border-right:0}

.metric-label{
  color:var(--muted);
  font-size:14px;
}

.metric-value{
  font-size:24px;
  margin-top:20px;
}

.section{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:48px;
  padding:52px 0;
  border-bottom:1px solid var(--line);
}

.section-title{
  font-size:16px;
  font-weight:600;
}

.copy{
  max-width:720px;
  font-size:19px;
  line-height:1.55;
  letter-spacing:-.018em;
}

.token-header{
  margin-bottom:30px;
}

.token-number{
  font-size:36px;
  letter-spacing:-.045em;
}

.token-sub{
  color:var(--muted);
  margin-top:7px;
  font-size:14px;
}

.chart{
  position:relative;
  height:300px;
  display:flex;
  align-items:flex-end;
  gap:5px;
  padding-top:26px;
  border-bottom:1px solid #aaa;
}

.grid-line{
  position:absolute;
  left:0;
  right:0;
  border-top:1px solid var(--line);
  pointer-events:none;
}

.bar{
  flex:1;
  min-width:2px;
  background:#171717;
}

.legend{
  display:flex;
  justify-content:space-between;
  padding-top:16px;
  font-size:14px;
}

.legend-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.legend-dot{
  width:10px;
  height:10px;
  background:#111;
  border-radius:50%;
}

.source-link{
  display:inline-flex;
  gap:7px;
  align-items:center;
  margin-top:24px;
  text-decoration:underline;
  text-underline-offset:4px;
}

@media(max-width:760px){
  main{padding-top:42px}
  .back{margin-bottom:42px}
  .model-head{grid-template-columns:1fr}
  .daily{text-align:left}
  .metrics{grid-template-columns:1fr}
  .metric{
    border-right:0;
    border-bottom:1px solid var(--line);
    padding-left:0!important;
  }
  .section{
    grid-template-columns:1fr;
    gap:22px;
  }
  .identity{gap:14px}
  .logo-box{width:48px;height:48px}
  .logo-box img{width:40px;height:40px}
}
</style>
</head>

<body>

<header>
  <nav class="nav">
    <a class="brand" href="../">zorix</a>

    <div class="nav-links">
      <a href="./">Usage</a>
      <a href="https://doc.zorix.it/">Docs</a>
    </div>
  </nav>
</header>

<main>
  <a class="back" href="./">← All models</a>

  <section class="model-head">
    <div class="identity">
      <div class="logo-box" id="logo"></div>

      <div>
        <div class="provider" id="provider"></div>
        <h1 id="name">Model</h1>

        <div class="tags">
          <span class="tag" id="family"></span>
          <span class="tag" id="status"></span>
        </div>
      </div>
    </div>

    <div class="daily">
      <div class="daily-label">Daily token volume</div>
      <div class="daily-value" id="daily">—</div>
    </div>
  </section>

  <section class="metrics">
    <div class="metric">
      <div class="metric-label">Context</div>
      <div class="metric-value" id="context">—</div>
    </div>

    <div class="metric">
      <div class="metric-label">Input</div>
      <div class="metric-value" id="inputPrice">—</div>
    </div>

    <div class="metric">
      <div class="metric-label">Output</div>
      <div class="metric-value" id="outputPrice">—</div>
    </div>
  </section>

  <section class="section">
    <div class="section-title">About</div>

    <div>
      <div class="copy" id="about"></div>
      <a class="source-link" id="docs" target="_blank" rel="noopener" hidden>
        View model documentation ↗
      </a>
    </div>
  </section>

  <section class="section">
    <div class="section-title">Tokens</div>

    <div>
      <div class="token-header">
        <div class="token-number" id="periodTotal"></div>
        <div class="token-sub">Usage trend · last 30 days</div>
      </div>

      <div class="chart" id="chart">
        <div class="grid-line" style="top:25%"></div>
        <div class="grid-line" style="top:50%"></div>
        <div class="grid-line" style="top:75%"></div>
      </div>

      <div class="legend">
        <div class="legend-left">
          <span class="legend-dot"></span>
          Token volume
        </div>

        <div id="latest"></div>
      </div>
    </div>
  </section>
</main>

<script src="./models.js?v=2"></script>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');
const models = window.ZORIX_MODEL_DETAILS || [];
const model = models.find(x => x.id === id);

const fmt = n => new Intl.NumberFormat('en-US',{
  notation:'compact',
  maximumFractionDigits:2
}).format(Number(n)||0);

if(!model){
  document.querySelector('main').innerHTML =
    '<a class="back" href="./">← All models</a><h1>Model not found</h1>';
}else{
  document.title = `${model.name} | Zorix Code`;

  document.getElementById('provider').textContent = model.provider;
  document.getElementById('name').textContent = model.name;
  document.getElementById('family').textContent = model.family;
  document.getElementById('status').textContent = model.status;
  document.getElementById('daily').textContent = fmt(model.dailyTokens) + ' tokens';

  document.getElementById('context').textContent = model.context || '—';
  document.getElementById('inputPrice').textContent = model.inputPrice || '—';
  document.getElementById('outputPrice').textContent = model.outputPrice || '—';
  document.getElementById('about').textContent = model.about || '';

  const logo = document.getElementById('logo');

  if(model.logo){
    logo.innerHTML = `<img src="${model.logo}" alt="">`;
  }else{
    logo.innerHTML = `<div class="logo-fallback">${model.provider.slice(0,1)}</div>`;
  }

  if(model.docs){
    const docs = document.getElementById('docs');
    docs.href = model.docs;
    docs.hidden = false;
  }

  const arr = model.chart || [];
  const max = Math.max(...arr,1);
  const chart = document.getElementById('chart');

  chart.insertAdjacentHTML(
    'beforeend',
    arr.map(v =>
      `<div class="bar" style="height:${Math.max(1,(v/max)*100)}%" title="${fmt(v)}"></div>`
    ).join('')
  );

  /*
    These chart points are currently relative trend values, so this deliberately
    does not claim their sum is measured 30-day token volume.
  */
  document.getElementById('periodTotal').textContent =
    fmt(model.dailyTokens) + ' tokens';

  document.getElementById('latest').textContent =
    fmt(model.dailyTokens);
}
</script>

</body>
</html>
