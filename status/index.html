<!doctype html>
<html lang="en">

<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="zorix-build" content="1788158633">






<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Zorix Status
</title>

<style>

:root{
  --bg:#fff;
  --text:#111;
  --muted:#6f6f69;
  --line:#e1e1dc;
  --soft:#f7f7f4;
  --ok:#16803c;
  --warn:#b45309;
  --bad:#b42318;
  --max:900px;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-font-smoothing:
    antialiased;
}

body{
  margin:0;

  background:var(--bg);
  color:var(--text);

  font-family:
    "OpenAI Sans",
    "Inter",
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

  letter-spacing:-.012em;
}

a{
  color:inherit;
  text-decoration:none;
}


/* HEADER */

header{
  border-bottom:
    1px solid var(--line);
}

.nav{
  max-width:var(--max);

  height:72px;

  margin:auto;
  padding:0 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;

  gap:10px;

  font-size:18px;
  font-weight:600;

  letter-spacing:-.035em;
}

.brand img{
  width:31px;
  height:31px;
}

.nav-links{
  display:flex;

  gap:22px;

  color:var(--muted);

  font-size:13px;
}


/* MAIN */

main{
  max-width:var(--max);

  margin:auto;

  padding:
    70px
    22px
    110px;
}


/* OVERALL */

.overall{
  padding-bottom:54px;
}

.badge{
  display:inline-flex;

  align-items:center;

  gap:8px;

  padding:
    7px
    11px;

  border:
    1px solid var(--line);

  border-radius:999px;

  font-size:12px;
}

.dot{
  width:9px;
  height:9px;

  border-radius:50%;

  background:#999;
}

h1{
  margin:
    21px
    0
    0;

  font-size:
    clamp(
      46px,
      7vw,
      72px
    );

  line-height:.96;

  font-weight:500;

  letter-spacing:-.055em;
}

.message{
  max-width:630px;

  margin-top:18px;

  color:var(--muted);

  font-size:15px;
  line-height:1.55;
}

.updated{
  margin-top:16px;

  color:#999;

  font-size:11px;
}


/* SECTION */

.section{
  padding:
    41px
    0;

  border-top:
    1px solid var(--line);
}

.section-head{
  display:flex;

  align-items:flex-end;
  justify-content:space-between;

  gap:22px;

  margin-bottom:22px;
}

.section-title{
  font-size:24px;

  letter-spacing:-.04em;
}

.section-copy{
  color:var(--muted);

  font-size:11px;
}


/* COMPONENTS */

.components{
  overflow:hidden;

  border:
    1px solid var(--line);

  border-radius:14px;
}

.component{
  min-height:83px;

  padding:
    17px
    18px;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  gap:20px;

  align-items:center;

  border-bottom:
    1px solid var(--line);
}

.component:last-child{
  border-bottom:0;
}

.component-name{
  font-size:14px;
}

.component-desc{
  margin-top:5px;

  color:var(--muted);

  font-size:11px;
  line-height:1.45;
}

.component-state{
  display:flex;

  align-items:center;

  gap:8px;

  font-size:12px;
}

.component-state .dot{
  flex:0 0 auto;
}


/* INCIDENT */

.history{
  display:grid;
  gap:13px;
}

.incident{
  padding:20px;

  border:
    1px solid var(--line);

  border-radius:13px;
}

.incident-head{
  display:flex;

  justify-content:
    space-between;

  gap:20px;
}

.incident-title{
  font-size:15px;
  font-weight:550;
}

.incident-state{
  color:var(--muted);

  font-size:11px;
}

.incident-message{
  margin-top:9px;

  color:var(--muted);

  font-size:12px;
  line-height:1.55;
}

.incident-time{
  margin-top:14px;

  color:#999;

  font-size:10px;
}

.empty{
  padding:31px;

  border:
    1px solid var(--line);

  border-radius:13px;

  color:var(--muted);

  text-align:center;

  font-size:12px;
}


/* STATES */

[data-status="operational"] .dot{
  background:var(--ok);
}

[data-status="degraded"] .dot,
[data-status="maintenance"] .dot{
  background:var(--warn);
}

[data-status="partial_outage"] .dot,
[data-status="outage"] .dot{
  background:var(--bad);
}


/* FOOTER */

footer{
  margin-top:42px;

  padding-top:24px;

  border-top:
    1px solid var(--line);

  display:flex;

  justify-content:
    space-between;

  gap:20px;

  color:var(--muted);

  font-size:11px;
}


@media(max-width:650px){

  .nav{
    padding:
      0
      17px;
  }

  .nav-links{
    gap:13px;
  }

  .nav-links a:first-child{
    display:none;
  }

  main{
    padding:
      49px
      17px
      90px;
  }

  .component{
    grid-template-columns:1fr;
    gap:10px;
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .incident-head{
    flex-direction:column;
  }

  footer{
    flex-direction:column;
  }

}

</style>

</head>


<body>


<header>

  <nav class="nav">

    <a
      class="brand"
      href="/"
    >

      <img
        src="/number-of-calls/assets/logos/zorix.svg?v=1788158633"
        alt=""
      >

      <span>
        Zorix Status
      </span>

    </a>


    <div class="nav-links">

      <a href="/">
        Updates
      </a>

      <a href="/number-of-calls/">
        Metron
      </a>

      <a href="#history">
        History
      </a>

    </div>

  </nav>

</header>



<main>


<section
  class="overall"
  id="overall"
  data-status="operational"
>

  <div class="badge">

    <span class="dot"></span>

    <span id="badgeText">
      Operational
    </span>

  </div>


  <h1 id="headline">
    We’re fully operational
  </h1>


  <div
    class="message"
    id="message"
  >
    All Zorix systems are operating normally.
  </div>


  <div
    class="updated"
    id="updated"
  ></div>

</section>



<section class="section">

  <div class="section-head">

    <div class="section-title">
      System status
    </div>

    <div class="section-copy">
      Current published service status
    </div>

  </div>


  <div
    class="components"
    id="components"
  ></div>

</section>



<section
  class="section"
  id="history"
>

  <div class="section-head">

    <div class="section-title">
      History
    </div>

    <div class="section-copy">
      Recent incidents
    </div>

  </div>


  <div
    class="history"
    id="incidents"
  ></div>

</section>



<footer>

  <span>
    Zorix Status
  </span>

  <span>
    Officially published system status.
  </span>

</footer>


</main>


<script src="./status.js?v=1788158633"></script>

<script>

const DATA =
  window.ZORIX_STATUS || {
    overall:"operational",
    message:
      "All Zorix systems are operating normally.",
    components:[],
    incidents:[]
  };


const LABELS={
  operational:"Operational",
  degraded:"Degraded performance",
  partial_outage:"Partial outage",
  outage:"Major outage",
  maintenance:"Maintenance"
};


function label(value){

  return (
    LABELS[value] ||
    value ||
    "Unknown"
  );

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}


const overall=
  document.getElementById(
    "overall"
  );


overall.dataset.status=
  DATA.overall ||
  "operational";


document
  .getElementById(
    "badgeText"
  )
  .textContent=
    label(
      DATA.overall
    );


document
  .getElementById(
    "headline"
  )
  .textContent=
    DATA.overall==="operational"
      ? "We’re fully operational"
      : "We’re currently experiencing issues";


document
  .getElementById(
    "message"
  )
  .textContent=
    DATA.message || "";


document
  .getElementById(
    "updated"
  )
  .textContent=
    DATA.updatedAt
      ? "Updated " +
        new Date(
          DATA.updatedAt
        ).toLocaleString()
      : "";


document
  .getElementById(
    "components"
  )
  .innerHTML=
    (
      DATA.components ||
      []
    )
    .map(
      item=>`

        <div
          class="component"
          data-status="${
            escapeHTML(
              item.status
            )
          }"
        >

          <div>

            <div class="component-name">
              ${
                escapeHTML(
                  item.name
                )
              }
            </div>

            <div class="component-desc">
              ${
                escapeHTML(
                  item.description ||
                  ""
                )
              }
            </div>

          </div>


          <div class="component-state">

            <span class="dot"></span>

            <span>
              ${
                escapeHTML(
                  label(
                    item.status
                  )
                )
              }
            </span>

          </div>

        </div>

      `
    )
    .join("");


const incidents=
  DATA.incidents || [];


document
  .getElementById(
    "incidents"
  )
  .innerHTML=
    incidents.length
      ? incidents.map(
          item=>`

            <article class="incident">

              <div class="incident-head">

                <div class="incident-title">
                  ${
                    escapeHTML(
                      item.title
                    )
                  }
                </div>

                <div class="incident-state">
                  ${
                    escapeHTML(
                      label(
                        item.status
                      )
                    )
                  }
                </div>

              </div>


              ${
                item.message
                  ? `
                    <div class="incident-message">
                      ${
                        escapeHTML(
                          item.message
                        )
                      }
                    </div>
                  `
                  : ""
              }


              <div class="incident-time">
                ${
                  item.startedAt
                    ? new Date(
                        item.startedAt
                      ).toLocaleString()
                    : ""
                }
              </div>

            </article>

          `
        )
        .join("")
      : `
          <div class="empty">
            No incidents reported.
          </div>
        `;

</script>


</body>
</html>
