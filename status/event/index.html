<!doctype html>
<html lang="en">

<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="zorix-build" content="1788160329">





<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Events | Zorix Status
</title>

<style>

:root{
  --bg:#fff;
  --text:#111;
  --muted:#6f6f69;
  --line:#dfdfda;
  --soft:#f7f7f4;

  --critical:#b42318;
  --major:#c2410c;
  --moderate:#a16207;
  --minor:#475569;

  --security:#b42318;
  --crash:#7c3aed;
  --infra:#2563eb;
  --capacity:#b45309;

  --ok:#16803c;

  --max:960px;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-font-smoothing:
    antialiased;
}

body{
  margin:0;

  background:var(--bg);
  color:var(--text);

  font-family:
    "OpenAI Sans",
    "Inter",
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}


/* HEADER */

header{
  border-bottom:
    1px solid var(--line);
}

.nav{
  max-width:var(--max);

  min-height:72px;

  margin:auto;
  padding:0 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;
}

.brand{
  font-size:18px;
  font-weight:600;

  letter-spacing:-.04em;
}

.nav-right{
  display:flex;

  gap:22px;

  color:var(--muted);

  font-size:12px;
}


/* MAIN */

main{
  max-width:var(--max);

  margin:auto;

  padding:
    70px
    22px
    110px;
}

.eyebrow{
  margin-bottom:14px;

  color:var(--muted);

  font-size:12px;
}

h1{
  margin:0;

  font-size:
    clamp(
      52px,
      8vw,
      88px
    );

  line-height:.92;

  font-weight:500;

  letter-spacing:-.06em;
}

.hero-copy{
  max-width:650px;

  margin-top:22px;

  color:var(--muted);

  font-size:14px;
  line-height:1.55;
}


/* SUMMARY */

.summary{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin:
    42px
    0
    35px;
}

.summary-card{
  padding:17px;

  border:
    1px solid var(--line);

  border-radius:12px;
}

.summary-value{
  font-size:29px;

  letter-spacing:-.04em;

  font-variant-numeric:
    tabular-nums;
}

.summary-label{
  margin-top:4px;

  color:var(--muted);

  font-size:10px;
}


/* FILTER */

.filters{
  display:flex;
  flex-wrap:wrap;

  gap:7px;

  padding:
    16px
    0;

  border-top:
    1px solid var(--line);

  border-bottom:
    1px solid var(--line);
}

.filter{
  border:0;

  border-radius:999px;

  padding:
    8px
    12px;

  background:transparent;

  cursor:pointer;

  font-size:11px;
}

.filter:hover{
  background:var(--soft);
}

.filter.active{
  background:#111;
  color:#fff;
}


/* EVENT */

.events{
  margin-top:25px;
}

.event{
  padding:
    27px
    0
    31px;

  border-bottom:
    1px solid var(--line);
}

.event:last-child{
  border-bottom:0;
}

.event-top{
  display:flex;

  align-items:flex-start;
  justify-content:space-between;

  gap:20px;
}

.event-title{
  max-width:680px;

  font-size:24px;
  line-height:1.12;

  letter-spacing:-.035em;
}

.event-badges{
  display:flex;
  flex-wrap:wrap;

  justify-content:flex-end;

  gap:5px;
}

.badge{
  display:inline-flex;

  align-items:center;

  min-height:24px;

  padding:0 8px;

  border:
    1px solid var(--line);

  border-radius:999px;

  color:var(--muted);

  font-size:9px;

  text-transform:uppercase;

  letter-spacing:.04em;
}

.badge.open{
  color:#fff;

  border-color:var(--critical);
  background:var(--critical);
}

.event-summary{
  max-width:720px;

  margin-top:13px;

  color:#484844;

  font-size:13px;
  line-height:1.6;
}

.event-meta{
  display:flex;
  flex-wrap:wrap;

  gap:12px;

  margin-top:16px;

  color:var(--muted);

  font-size:10px;
}

.event-details{
  margin-top:18px;

  padding:
    16px
    17px;

  border:
    1px solid var(--line);

  border-radius:11px;

  background:var(--soft);
}

.event-details summary{
  cursor:pointer;

  font-size:11px;

  font-weight:550;
}

.event-details ul{
  margin:
    13px
    0
    0;

  padding-left:17px;

  color:#4f4f4a;

  font-size:11px;
  line-height:1.6;
}

.attribution{
  margin-top:13px;

  padding:
    11px
    13px;

  border-left:
    2px solid var(--line);

  color:var(--muted);

  font-size:10px;
  line-height:1.55;
}


/* TYPE */

.event[data-type="security"]
.event-type{
  color:var(--security);
}

.event[data-type="crash"]
.event-type{
  color:var(--crash);
}

.event[data-type="infrastructure"]
.event-type{
  color:var(--infra);
}

.event[data-type="capacity"]
.event-type{
  color:var(--capacity);
}


.empty{
  padding:
    70px
    0;

  color:var(--muted);

  text-align:center;

  font-size:13px;
}


@media(max-width:700px){

  .nav{
    padding:
      0
      17px;
  }

  .nav-right a:first-child{
    display:none;
  }

  main{
    padding:
      50px
      17px
      90px;
  }

  .summary{
    grid-template-columns:
      1fr 1fr;
  }

  .event-top{
    flex-direction:column;
  }

  .event-badges{
    justify-content:flex-start;
  }

}

</style>

</head>


<body>

<header>

  <nav class="nav">

    <a
      class="brand"
      href="/status/"
    >
      Zorix Status
    </a>


    <div class="nav-right">

      <a href="/status/">
        System status
      </a>

      <a href="/">
        Updates
      </a>

    </div>

  </nav>

</header>


<main>


<section>

  <div class="eyebrow">
    Security & reliability
  </div>

  <h1>
    Events
  </h1>

  <div class="hero-copy">
    Recorded security events, crashes,
    infrastructure failures and capacity incidents
    affecting Zorix systems.
  </div>

</section>



<div class="summary">

  <div class="summary-card">

    <div
      class="summary-value"
      id="totalCount"
    >
      —
    </div>

    <div class="summary-label">
      Recorded events
    </div>

  </div>


  <div class="summary-card">

    <div
      class="summary-value"
      id="openCount"
    >
      —
    </div>

    <div class="summary-label">
      Active
    </div>

  </div>


  <div class="summary-card">

    <div
      class="summary-value"
      id="securityCount"
    >
      —
    </div>

    <div class="summary-label">
      Security
    </div>

  </div>


  <div class="summary-card">

    <div
      class="summary-value"
      id="crashCount"
    >
      —
    </div>

    <div class="summary-label">
      Crashes
    </div>

  </div>

</div>



<div
  class="filters"
  id="filters"
>

  <button
    class="filter active"
    data-filter="all"
    type="button"
  >
    All
  </button>

  <button
    class="filter"
    data-filter="security"
    type="button"
  >
    Security
  </button>

  <button
    class="filter"
    data-filter="crash"
    type="button"
  >
    Crash
  </button>

  <button
    class="filter"
    data-filter="infrastructure"
    type="button"
  >
    Infrastructure
  </button>

  <button
    class="filter"
    data-filter="capacity"
    type="button"
  >
    Capacity
  </button>

</div>



<div
  class="events"
  id="events"
></div>


</main>


<script src="./events.js?v=1788160329"></script>

<script>

const DATA =
  window.ZORIX_STATUS_EVENTS || {
    events:[]
  };


const events =
  Array.isArray(
    DATA.events
  )
    ? DATA.events
    : [];


let currentFilter="all";


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}


function formatDate(value){

  if(!value){
    return "Unknown time";
  }


  const date=
    new Date(value);


  return date.toLocaleString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function typeName(type){

  const map={
    security:"Security",
    crash:"Crash",
    infrastructure:"Infrastructure",
    capacity:"Capacity"
  };


  return (
    map[type] ||
    type ||
    "Event"
  );

}


function severityName(value){

  return (
    value ||
    "unknown"
  );
}


function render(){

  const visible=
    currentFilter==="all"
      ? events
      : events.filter(
          event=>
            event.type===
            currentFilter
        );


  document
    .getElementById(
      "events"
    )
    .innerHTML=
      visible.length
        ? visible.map(
            event=>`

              <article
                class="event"
                data-type="${
                  escapeHTML(
                    event.type
                  )
                }"
              >

                <div class="event-top">

                  <div>

                    <div
                      class="event-type eyebrow"
                    >
                      ${
                        escapeHTML(
                          typeName(
                            event.type
                          )
                        )
                      }
                    </div>


                    <div class="event-title">
                      ${
                        escapeHTML(
                          event.title
                        )
                      }
                    </div>

                  </div>


                  <div class="event-badges">

                    <span class="badge">
                      ${
                        escapeHTML(
                          severityName(
                            event.severity
                          )
                        )
                      }
                    </span>

                    <span
                      class="badge ${
                        event.status!=="resolved"
                          ? "open"
                          : ""
                      }"
                    >
                      ${
                        escapeHTML(
                          event.status
                        )
                      }
                    </span>

                  </div>

                </div>


                <div class="event-summary">
                  ${
                    escapeHTML(
                      event.summary
                    )
                  }
                </div>


                <div class="event-meta">

                  <span>
                    Started · ${
                      escapeHTML(
                        formatDate(
                          event.startedAt
                        )
                      )
                    }
                  </span>

                  ${
                    event.resolvedAt
                      ? `
                        <span>
                          Resolved · ${
                            escapeHTML(
                              formatDate(
                                event.resolvedAt
                              )
                            )
                          }
                        </span>
                      `
                      : ""
                  }

                  ${
                    event.source
                      ? `
                        <span>
                          Source · ${
                            escapeHTML(
                              event.source
                            )
                          }
                        </span>
                      `
                      : ""
                  }

                </div>


                ${
                  event.attribution
                    ? `
                      <div class="attribution">
                        <strong>
                          Attribution note —
                        </strong>

                        ${
                          escapeHTML(
                            event.attribution
                          )
                        }
                      </div>
                    `
                    : ""
                }


                ${
                  Array.isArray(
                    event.details
                  )
                  &&
                  event.details.length
                    ? `
                      <details class="event-details">

                        <summary>
                          Technical details
                        </summary>

                        <ul>

                          ${
                            event.details
                              .map(
                                item=>`
                                  <li>
                                    ${
                                      escapeHTML(
                                        item
                                      )
                                    }
                                  </li>
                                `
                              )
                              .join("")
                          }

                        </ul>

                      </details>
                    `
                    : ""
                }

              </article>

            `
          )
          .join("")
        : `
            <div class="empty">
              No events in this category.
            </div>
          `;

}


document
  .getElementById(
    "totalCount"
  )
  .textContent=
    events.length;


document
  .getElementById(
    "openCount"
  )
  .textContent=
    events.filter(
      event=>
        event.status!=="resolved"
    ).length;


document
  .getElementById(
    "securityCount"
  )
  .textContent=
    events.filter(
      event=>
        event.type==="security"
    ).length;


document
  .getElementById(
    "crashCount"
  )
  .textContent=
    events.filter(
      event=>
        event.type==="crash"
    ).length;


document
  .querySelectorAll(
    ".filter"
  )
  .forEach(
    button=>{

      button.addEventListener(
        "click",
        ()=>{

          currentFilter=
            button.dataset.filter;


          document
            .querySelectorAll(
              ".filter"
            )
            .forEach(
              item=>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          render();

        }
      );

    }
  );


render();

</script>

</body>
</html>
