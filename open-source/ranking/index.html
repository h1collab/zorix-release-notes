<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="description"
  content="Official Zorix open source model ranking."
>

<title>
  Open Source Ranking | Zorix
</title>

<style>

:root{
  --bg:#fff;
  --text:#111;
  --muted:#6f6f69;
  --line:#e3e3df;
  --soft:#f7f7f5;
  --accent:#7c3aed;
  --max:1060px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  background:var(--bg);
  color:var(--text);

  font-family:
    "OpenAI Sans",
    "Inter",
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

  letter-spacing:-.012em;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
}

header{
  position:sticky;
  top:0;

  z-index:40;

  background:
    rgba(255,255,255,.96);

  border-bottom:
    1px solid var(--line);

  backdrop-filter:
    blur(16px);
}

.nav{
  max-width:var(--max);

  min-height:72px;

  margin:auto;
  padding:
    11px
    20px;

  display:flex;
  align-items:center;

  gap:15px;
}

.logo{
  width:41px;
  height:41px;

  flex:0 0 41px;

  display:grid;
  place-items:center;

  border:
    1px solid var(--line);

  border-radius:12px;
}

.logo img{
  width:28px;
  height:28px;
}

.search{
  flex:1;

  min-height:44px;

  padding:
    0
    14px;

  border:
    1px solid var(--line);

  border-radius:11px;

  outline:none;

  font-size:12px;
}

.nav-link{
  color:var(--muted);

  font-size:11px;
}

main{
  max-width:var(--max);

  margin:auto;

  padding:
    41px
    20px
    90px;
}

.eyebrow{
  color:var(--muted);

  font-size:9px;

  text-transform:uppercase;

  letter-spacing:.075em;
}

h1{
  margin:
    11px
    0
    0;

  font-size:
    clamp(
      38px,
      7vw,
      67px
    );

  line-height:.98;

  font-weight:600;

  letter-spacing:-.055em;
}

.intro{
  max-width:650px;

  margin-top:19px;

  color:var(--muted);

  font-size:13px;
  line-height:1.6;
}

.toolbar{
  margin-top:38px;

  padding:
    12px
    0;

  display:flex;
  flex-wrap:wrap;

  gap:7px;

  border-top:
    1px solid var(--line);

  border-bottom:
    1px solid var(--line);
}

.sort{
  min-height:35px;

  padding:
    0
    11px;

  border:
    1px solid var(--line);

  border-radius:8px;

  background:#fff;

  color:var(--muted);

  cursor:pointer;

  font-size:10px;
}

.sort.active{
  background:#111;

  border-color:#111;

  color:#fff;
}

.snapshot{
  margin-left:auto;

  display:flex;
  align-items:center;

  color:var(--muted);

  font-size:9px;
}

.count{
  padding:
    18px
    0
    10px;

  color:var(--muted);

  font-size:10px;
}

.models{
  display:grid;

  gap:10px;
}

.card{
  padding:17px;

  display:block;

  border:
    1px solid var(--line);

  border-radius:14px;

  background:#fff;
}

.card:hover{
  border-color:#bbb;
}

.card-head{
  display:grid;

  grid-template-columns:
    38px
    43px
    minmax(0,1fr)
    auto;

  gap:10px;

  align-items:start;
}

.rank{
  width:36px;
  height:36px;

  display:grid;
  place-items:center;

  border:
    1px solid var(--line);

  border-radius:10px;

  background:var(--soft);

  font-size:10px;
  font-weight:600;
}

.model-logo{
  width:41px;
  height:41px;

  display:grid;
  place-items:center;

  border:
    1px solid var(--line);

  border-radius:10px;
}

.model-logo img{
  width:28px;
  height:28px;
}

.owner{
  color:#999;

  font-size:10px;
}

.name{
  margin-top:4px;

  font-size:18px;
  font-weight:600;

  letter-spacing:-.035em;

  overflow-wrap:anywhere;
}

.likes{
  min-height:35px;

  padding:
    0
    9px;

  display:flex;
  align-items:center;

  gap:6px;

  border:
    1px solid var(--line);

  border-radius:9px;

  color:#666;

  font-size:10px;
}

.likes svg{
  width:13px;
  height:13px;
}

.tags{
  margin:
    14px
    0
    0
    101px;

  display:flex;
  flex-wrap:wrap;

  gap:6px;
}

.tag{
  min-height:28px;

  padding:
    0
    8px;

  display:inline-flex;
  align-items:center;

  border:
    1px solid var(--line);

  border-radius:8px;

  color:#555;

  font-size:9px;
}

.body{
  margin:
    17px
    0
    0
    101px;

  padding-top:15px;

  display:grid;

  grid-template-columns:
    175px
    minmax(0,1fr)
    180px;

  gap:20px;

  align-items:center;

  border-top:
    1px solid #ecece8;
}

.metric-k{
  color:var(--muted);

  font-size:9px;
}

.metric-v{
  margin-top:7px;

  font-size:21px;
  font-weight:550;
}

.chart-placeholder{
  min-height:55px;

  display:flex;
  align-items:center;

  color:var(--muted);

  font-size:9px;
}

.specs{
  display:grid;

  gap:7px;
}

.spec{
  display:flex;

  justify-content:space-between;

  gap:13px;

  font-size:9px;
}

.spec span:first-child{
  color:var(--muted);
}

.empty{
  padding:
    50px
    20px;

  border:
    1px solid var(--line);

  border-radius:13px;

  color:var(--muted);

  text-align:center;

  font-size:11px;
}

@media(max-width:700px){

  .nav-link{
    display:none;
  }

  main{
    padding:
      31px
      14px
      75px;
  }

  .card{
    padding:14px;
  }

  .card-head{
    grid-template-columns:
      33px
      39px
      minmax(0,1fr)
      auto;

    gap:7px;
  }

  .rank{
    width:31px;
    height:31px;
  }

  .model-logo{
    width:37px;
    height:37px;
  }

  .model-logo img{
    width:25px;
    height:25px;
  }

  .name{
    font-size:15px;
  }

  .tags,
  .body{
    margin-left:0;
  }

  .body{
    grid-template-columns:1fr;
  }

  .snapshot{
    width:100%;

    margin-left:0;
  }

}

</style>

</head>


<body>

<header>

  <div class="nav">

    <a
      class="logo"
      href="/open-source/ranking/"
    >

      <img
        src="/number-of-calls/assets/logos/zorix.svg"
        alt="Zorix"
      >

    </a>


    <input
      class="search"
      id="search"
      placeholder="Search Zorix open models"
      autocomplete="off"
    >


    <a
      class="nav-link"
      href="/number-of-calls/"
    >
      Metron
    </a>


    <a
      class="nav-link"
      href="/status/"
    >
      Status
    </a>

  </div>

</header>


<main>

  <div class="eyebrow">
    Zorix Open Source
  </div>

  <h1>
    Open model ranking
  </h1>

  <div class="intro">
    Official open models developed and published
    by Zorix. No third-party model catalog is included.
  </div>


  <div class="toolbar">

    <button
      class="sort active"
      data-sort="downloads"
      type="button"
    >
      Downloads
    </button>

    <button
      class="sort"
      data-sort="likes"
      type="button"
    >
      Likes
    </button>

    <button
      class="sort"
      data-sort="size"
      type="button"
    >
      Model size
    </button>


    <div
      class="snapshot"
      id="snapshot"
    ></div>

  </div>


  <div
    class="count"
    id="count"
  ></div>


  <div
    class="models"
    id="models"
  ></div>

</main>


<script src="/open-source/open-source.js"></script>

<script>

const DB =
  window.ZORIX_OPEN_SOURCE
  ||
  {
    models:[]
  };


let sortMode =
  "downloads";


const search =
  document.getElementById(
    "search"
  );


function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}


function compact(value){

  return new Intl.NumberFormat(
    "en-US",
    {
      notation:"compact",
      maximumFractionDigits:2
    }
  )
  .format(
    Number(
      value || 0
    )
  );

}


function render(){

  const query =
    search.value
    .trim()
    .toLowerCase();


  let rows =
    (
      DB.models
      ||
      []
    )
    .filter(
      model=>{

        return (
          !query
          ||
          [
            model.name,
            model.id,
            model.architecture,
            model.license,
            ...(model.languages || []),
            ...(model.tags || [])
          ]
          .join(" ")
          .toLowerCase()
          .includes(query)
        );

      }
    );


  rows.sort(
    (a,b)=>{

      if(sortMode==="likes"){

        return (
          Number(
            b.likes || 0
          )
          -
          Number(
            a.likes || 0
          )
        );

      }


      if(sortMode==="size"){

        return (
          Number(
            b.parameters || 0
          )
          -
          Number(
            a.parameters || 0
          )
        );

      }


      return (
        Number(
          b.downloadsLastMonth || 0
        )
        -
        Number(
          a.downloadsLastMonth || 0
        )
      );

    }
  );


  document
    .getElementById(
      "count"
    )
    .textContent =
      rows.length
      +
      (
        rows.length===1
          ? " model"
          : " models"
      );


  const target =
    document.getElementById(
      "models"
    );


  if(!rows.length){

    target.innerHTML=`
      <div class="empty">
        No Zorix open models match this search.
      </div>
    `;

    return;
  }


  target.innerHTML =
    rows.map(
      (model,index)=>{

        const tags = [
          ...(model.formats || []),
          ...(model.languages || []),
          ...(model.tags || []).slice(0,4),
          (
            model.license
              ? (
                  "License: "
                  +
                  model.license
                )
              : ""
          )
        ]
        .filter(Boolean);


        return `

          <a
            class="card"
            href="/open-source/models/${encodeURIComponent(model.slug)}/"
          >

            <div class="card-head">

              <div class="rank">
                ${index+1}
              </div>


              <div class="model-logo">

                <img
                  src="${esc(model.logo)}"
                  alt="Zorix"
                >

              </div>


              <div>

                <div class="owner">
                  Zorix / Official
                </div>

                <div class="name">
                  ${esc(model.name)}
                </div>

              </div>


              <div class="likes">

                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M12 20.3s-7.2-4.3-9.5-8.5C.6 8.4 2.2 4.7 6 4.7c2.3 0 3.7 1.3 4.5 2.5.8-1.2 2.2-2.5 4.5-2.5 3.8 0 5.4 3.7 3.5 7.1-2.3 4.2-6.5 8.5-6.5 8.5Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                </svg>

                ${compact(model.likes)}

              </div>

            </div>


            <div class="tags">

              ${
                tags.map(
                  value=>`
                    <span class="tag">
                      ${esc(value)}
                    </span>
                  `
                )
                .join("")
              }

            </div>


            <div class="body">

              <div>

                <div class="metric-k">
                  Downloads last month
                </div>

                <div class="metric-v">
                  ${compact(
                    model.downloadsLastMonth
                  )}
                </div>

              </div>


              <div class="chart-placeholder">

                ${
                  (
                    model.downloadHistory
                    ||
                    []
                  ).length>=2

                    ? "Recorded download history available"

                    : "Historical series not published"
                }

              </div>


              <div class="specs">

                <div class="spec">
                  <span>Model size</span>
                  <span>
                    ${esc(model.modelSize || "Not published")}
                  </span>
                </div>

                <div class="spec">
                  <span>Architecture</span>
                  <span>
                    ${esc(model.architecture || "Not published")}
                  </span>
                </div>

                <div class="spec">
                  <span>Format</span>
                  <span>
                    ${esc(
                      (
                        model.formats
                        ||
                        []
                      ).join(", ")
                    )}
                  </span>
                </div>

              </div>

            </div>

          </a>
        `;

      }
    )
    .join("");

}


document
  .querySelectorAll(
    "[data-sort]"
  )
  .forEach(
    button=>{

      button
        .addEventListener(
          "click",
          ()=>{

            document
              .querySelectorAll(
                "[data-sort]"
              )
              .forEach(
                item=>
                  item.classList.remove(
                    "active"
                  )
              );


            button
              .classList
              .add(
                "active"
              );


            sortMode =
              button.dataset.sort;


            render();

          }
        );

    }
  );


search.addEventListener(
  "input",
  render
);


document
  .getElementById(
    "snapshot"
  )
  .textContent =
    DB.dataAsOf
      ? (
          "Data as of "
          +
          DB.dataAsOf
        )
      : "";


render();

</script>

</body>

</html>
